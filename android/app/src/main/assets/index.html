  --neon-cyan:#22d3ee; --neon-pink:#f472b6; --neon-purple:#c084fc; --neon-green:#34d399;
  --glow1:rgba(56,189,248,.17); --glow2:rgba(192,132,252,.13); --grid:rgba(56,189,248,.06);
}
*{margin:0;padding:0;box-sizing:border-box;border-color:var(--border)}
html{font-family:'Vazirmatn',system-ui,sans-serif;-webkit-text-size-adjust:100%}
body{color:var(--foreground);font-size:var(--appfs,16px);line-height:1.6;overflow-x:hidden;
  background-color:var(--background);
  background-image:
    radial-gradient(55rem 38rem at 88% -8%,var(--glow1),transparent 62%),
    radial-gradient(48rem 34rem at 6% 108%,var(--glow2),transparent 62%),
    linear-gradient(var(--grid) 1px,transparent 1px),
    linear-gradient(90deg,var(--grid) 1px,transparent 1px);
  background-size:100% 100%,100% 100%,2.75rem 2.75rem,2.75rem 2.75rem;
  background-attachment:fixed}
button{font-family:inherit;cursor:pointer;border:none;background:none;color:inherit}
input{font-family:inherit}
::-webkit-scrollbar{width:5px;height:5px}
::-webkit-scrollbar-track{background:transparent}
::-webkit-scrollbar-thumb{background:color-mix(in srgb,var(--primary) 50%,transparent);border-radius:99px;box-shadow:0 0 8px color-mix(in srgb,var(--primary) 45%,transparent)}

/* ─── چیدمان کلی ─── */
#app{min-height:100vh;display:flex;flex-direction:column}
header.top{position:sticky;top:0;z-index:40;border-bottom:1px solid color-mix(in srgb,var(--border) 60%,transparent);background:color-mix(in srgb,var(--background) 80%,transparent);backdrop-filter:blur(10px);box-shadow:0 10px 30px -14px color-mix(in srgb,var(--primary) 45%,transparent)}
.topin{max-width:32rem;margin:0 auto;height:3.5rem;display:flex;align-items:center;gap:.5rem;padding:0 1rem}
.topin h1{min-width:0;flex:1;font-size:.95rem;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
@media(min-width:640px){.topin h1{font-size:1rem}}
.iconbtn{display:flex;align-items:center;justify-content:center;width:2.25rem;height:2.25rem;flex-shrink:0;border-radius:.75rem;background:var(--secondary);transition:.15s}
.iconbtn:active{transform:scale(.94)}
.logobox{display:flex;align-items:center;justify-content:center;width:2.25rem;height:2.25rem;flex-shrink:0;border-radius:.75rem;background:var(--navy)}
.logobox svg{width:1.5rem;height:1.5rem}
.probtn{display:flex;align-items:center;gap:.375rem;height:2.25rem;padding:0 .75rem;border-radius:.75rem;font-size:.75rem;font-weight:700;transition:.15s;flex-shrink:0}
.probtn.free{background:var(--primary);color:var(--primary-foreground);box-shadow:0 0 16px -4px color-mix(in srgb,var(--primary) 75%,transparent)}
.probtn.on{background:color-mix(in srgb,var(--primary) 15%,transparent);color:var(--primary)}
.probtn:active{transform:scale(.96)}
main{max-width:32rem;width:100%;margin:0 auto;flex:1;padding:1rem 1rem 7rem}
nav.bottom{position:fixed;left:0;right:0;bottom:0;z-index:40;border-top:1px solid color-mix(in srgb,var(--border) 60%,transparent);background:color-mix(in srgb,var(--card) 88%,transparent);backdrop-filter:blur(10px);padding-bottom:env(safe-area-inset-bottom);box-shadow:0 -10px 28px -14px color-mix(in srgb,var(--primary) 40%,transparent)}
.navin{max-width:32rem;margin:0 auto;display:grid;grid-template-columns:repeat(4,1fr)}
.navbtn{display:flex;flex-direction:column;align-items:center;gap:.25rem;padding:.625rem 0;font-size:.6875rem;font-weight:500;color:var(--muted-foreground);transition:.15s}
.navbtn .pill{display:flex;align-items:center;justify-content:center;width:3.5rem;height:2rem;border-radius:99px;transition:.2s}
.navbtn.active{color:var(--primary);text-shadow:0 0 12px color-mix(in srgb,var(--primary) 65%,transparent)}
.navbtn.active .pill{background:color-mix(in srgb,var(--primary) 15%,transparent);box-shadow:0 0 16px -4px color-mix(in srgb,var(--primary) 65%,transparent)}
.ic{width:1.25rem;height:1.25rem;flex-shrink:0}
.ic.sm{width:1rem;height:1rem}.ic.xs{width:.875rem;height:.875rem}.ic.xxs{width:.75rem;height:.75rem}.ic.lg{width:1.5rem;height:1.5rem}.ic.xl{width:1.75rem;height:1.75rem}.ic.xxl{width:2rem;height:2rem}

/* ─── اجزای مشترک ─── */
.card{border:1px solid var(--border);background:var(--card);border-radius:1.5rem}
.pad{padding:1rem}
.p15{padding:1.25rem}
.space>*+*{margin-top:.75rem}
.space3>*+*{margin-top:.875rem}
.muted{color:var(--muted-foreground)}
.t11{font-size:.6875rem}.t105{font-size:.65625rem}.t12{font-size:.75rem}.t125{font-size:.78125rem}.t13{font-size:.8125rem}.t14{font-size:.875rem}.t15{font-size:.9375rem}.t18{font-size:1.125rem}
.b{font-weight:700}.eb{font-weight:800}.mb{font-weight:500}
.lh5{line-height:1.25rem}.lh6{line-height:1.5rem}.lh7{line-height:1.75rem}.lh8{line-height:2rem}
.center{text-align:center}
.row{display:flex;align-items:center;gap:.75rem}
.rowb{display:flex;align-items:flex-start;gap:.75rem}
.grow{min-width:0;flex:1}
.shrink0{flex-shrink:0}
.chip{display:inline-flex;align-items:center;border-radius:99px;padding:.125rem .625rem;font-size:.6875rem;font-weight:700;background:color-mix(in srgb,#fff 10%,transparent)}
.btn{display:flex;align-items:center;justify-content:center;gap:.25rem;width:100%;padding:.9rem 1rem;border-radius:1rem;font-size:.8125rem;font-weight:800;background:var(--primary);color:var(--primary-foreground);transition:.15s}
.btn:active{transform:scale(.985);filter:brightness(1.06)}
.btn.sec{background:var(--secondary);color:var(--foreground)}
.btn:disabled{opacity:.7;cursor:default}
.iconrow{display:flex;align-items:center;justify-content:center;gap:.5rem;width:100%;padding:1rem;border-radius:1rem;font-size:.75rem;font-weight:800}
.badge-gold{display:flex;align-items:center;gap:.25rem;border-radius:99px;background:color-mix(in srgb,var(--primary) 15%,transparent);color:var(--primary);padding:.25rem .5rem;font-size:.5625rem;font-weight:700}
.badge-free{border-radius:99px;background:color-mix(in srgb,var(--emerald) 15%,transparent);color:var(--emerald-dark);padding:.125rem .5rem;font-size:.5625rem;font-weight:700}
.gold-glow{box-shadow:0 0 0 1px color-mix(in srgb,var(--primary) 40%,transparent),0 0 22px -4px color-mix(in srgb,var(--primary) 45%,transparent),0 14px 44px -14px color-mix(in srgb,var(--primary) 55%,transparent)}
.spin{animation:spin 1s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes fadeUp{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
@keyframes fadeSide{from{opacity:0;transform:translateX(-18px)}to{opacity:1;transform:none}}
.anim{animation:fadeUp .3s ease both}
.screenin{animation:fadeSide .22s ease-out both}
.d1{animation-delay:.05s}.d2{animation-delay:.1s}.d3{animation-delay:.15s}.d4{animation-delay:.2s}.d5{animation-delay:.25s}.d6{animation-delay:.3s}.d7{animation-delay:.35s}
@keyframes scanline{0%{transform:translateY(-100%)}100%{transform:translateY(400%)}}
.scanbox{position:relative;overflow:hidden;border:1px solid color-mix(in srgb,var(--primary) 40%,transparent);background:var(--card);border-radius:1rem;padding:1rem}
.scanline{position:absolute;left:0;right:0;height:2.5rem;background:linear-gradient(to bottom,transparent,color-mix(in srgb,var(--primary) 10%,transparent),transparent);animation:scanline 1.6s ease-in-out infinite}
@keyframes pulsering{0%{transform:scale(.9);opacity:.7}70%{transform:scale(1.25);opacity:0}100%{opacity:0}}
.pulse-ring{position:relative}
.pulse-ring::after{content:"";position:absolute;inset:0;border-radius:inherit;border:2px solid var(--primary);box-shadow:0 0 14px color-mix(in srgb,var(--primary) 60%,transparent);animation:pulsering 1.8s ease-out infinite}
/* گرادیان نئونی کارت‌های ویژه */
.neonhero{background:
  radial-gradient(120% 160% at 85% 0%,color-mix(in srgb,var(--primary) 30%,transparent),transparent 55%),
  radial-gradient(110% 140% at 10% 110%,color-mix(in srgb,var(--neon-purple) 26%,transparent),transparent 55%),
  linear-gradient(160deg,#122452,var(--navy) 55%,#0b1330)}
.neontext{color:var(--primary);text-shadow:0 0 10px color-mix(in srgb,var(--primary) 60%,transparent),0 0 34px color-mix(in srgb,var(--primary) 35%,transparent)}
.chip.c1{border:1px solid color-mix(in srgb,var(--primary) 50%,transparent);background:color-mix(in srgb,var(--primary) 20%,transparent);box-shadow:0 0 10px -2px color-mix(in srgb,var(--primary) 70%,transparent)}
.chip.c2{border:1px solid color-mix(in srgb,var(--neon-purple) 50%,transparent);background:color-mix(in srgb,var(--neon-purple) 20%,transparent)}
.chip.c3{border:1px solid color-mix(in srgb,var(--neon-pink) 50%,transparent);background:color-mix(in srgb,var(--neon-pink) 20%,transparent)}

/* ─── بلوک‌های درس ─── */
.blk{border:1px solid var(--border);background:var(--card);border-radius:1.5rem;padding:1rem}
.blk.danger{border-color:color-mix(in srgb,var(--destructive) 30%,transparent);background:color-mix(in srgb,var(--destructive) 8%,transparent)}
.blk.gold{border-color:color-mix(in srgb,var(--gold) 35%,transparent);background:color-mix(in srgb,var(--gold) 8%,transparent)}
.blk.warn{border-color:color-mix(in srgb,var(--amber) 35%,transparent);background:color-mix(in srgb,var(--amber) 8%,transparent)}
.blk.action{border-color:color-mix(in srgb,var(--emerald) 35%,transparent);background:color-mix(in srgb,var(--emerald) 8%,transparent)}
.blk.summary{background:var(--secondary)}
.blk h3{display:flex;align-items:center;gap:.5rem;font-size:.8125rem;font-weight:800;margin-bottom:.375rem}
.blk .bicon{display:flex;align-items:center;justify-content:center;width:1.75rem;height:1.75rem;border-radius:.5rem}
.blk .bicon.neutral,.blk .bicon.gold{background:color-mix(in srgb,var(--primary) 15%,transparent);color:var(--primary)}
.blk .bicon.danger{background:color-mix(in srgb,var(--destructive) 15%,transparent);color:var(--destructive)}
.blk .bicon.warn{background:color-mix(in srgb,var(--amber) 15%,transparent);color:var(--amber-dark)}
.blk .bicon.action{background:color-mix(in srgb,var(--emerald) 15%,transparent);color:var(--emerald-dark)}
.blk .bicon.summary{background:var(--secondary)}
.blk p{font-size:.78125rem;line-height:1.75rem;color:color-mix(in srgb,var(--foreground) 85%,transparent)}

/* ─── شبکه‌ها و ردیف‌های صفحه اصلی/لیست‌ها ─── */
.grid2{display:grid;grid-template-columns:repeat(2,1fr);gap:.75rem}
.grid4{display:grid;grid-template-columns:repeat(4,1fr);gap:.5rem}
.toolgrid{display:grid;grid-template-columns:1fr;gap:.625rem}
@media(min-width:640px){.toolgrid{grid-template-columns:repeat(2,1fr)}}
.catcard{display:flex;flex-direction:column;align-items:flex-start;gap:.5rem;text-align:right;transition:.15s}
.catcard:active{transform:scale(.98)}
.catcard:hover{border-color:color-mix(in srgb,var(--primary) 50%,transparent);box-shadow:0 10px 15px -3px rgba(0,0,0,.1)}
.caticon{display:flex;align-items:center;justify-content:center;width:2.75rem;height:2.75rem;border-radius:1rem;background:color-mix(in srgb,var(--primary) 15%,transparent);color:var(--primary)}
.catlink{margin-top:auto;display:flex;align-items:center;gap:.25rem;font-size:.6875rem;font-weight:700;color:var(--primary)}
.quickrow{display:flex;align-items:center;gap:.75rem;padding:.875rem;text-align:right;transition:.15s}
.quickrow:active{transform:scale(.98)}
.qicon{display:flex;align-items:center;justify-content:center;width:2.5rem;height:2.5rem;flex-shrink:0;border-radius:.75rem}
.lesrow{display:flex;align-items:center;gap:.75rem;padding:.875rem;text-align:right;transition:.15s;animation:fadeUp .3s ease both}
.lesrow:active{transform:scale(.985)}
.lesrow:hover{border-color:color-mix(in srgb,var(--primary) 50%,transparent);box-shadow:0 4px 6px -1px rgba(0,0,0,.1)}
.lesicon{display:flex;align-items:center;justify-content:center;width:3rem;height:3rem;flex-shrink:0;border-radius:1rem;background:color-mix(in srgb,var(--primary) 12%,transparent);color:var(--primary)}

/* ─── ردیف برنامه (AppRow) ─── */
.approw{display:flex;align-items:center;gap:.75rem;border:1px solid var(--border);background:var(--card);border-radius:1rem;padding:.75rem}
.appicon{display:flex;align-items:center;justify-content:center;width:2.5rem;height:2.5rem;flex-shrink:0;border-radius:.75rem;font-size:1rem;font-weight:800}
.appicon.bad{background:color-mix(in srgb,var(--destructive) 15%,transparent);color:var(--destructive)}
.appicon.google{background:color-mix(in srgb,var(--primary) 15%,transparent);color:var(--primary)}
.appicon.ok{background:var(--secondary);color:color-mix(in srgb,var(--foreground) 70%,transparent)}
.tag{border-radius:.375rem;padding:.125rem .375rem;font-size:.5625rem;background:var(--muted)}
.tag.bad{background:color-mix(in srgb,var(--destructive) 15%,transparent);color:var(--destructive);font-weight:700}
.mono{font-family:ui-monospace,SFMono-Regular,Menlo,monospace}
.ltr{direction:ltr}

/* ─── سوئیچ، چک‌باکس، اسلایدر ─── */
.sw{position:relative;width:2.6rem;height:1.45rem;border-radius:99px;background:var(--muted);transition:.2s;flex-shrink:0}
.sw::after{content:"";position:absolute;top:.15rem;right:.15rem;width:1.15rem;height:1.15rem;border-radius:99px;background:#fff;transition:.2s;box-shadow:0 1px 3px rgba(0,0,0,.25)}
.sw.on{background:var(--primary)}
.sw.on::after{transform:translateX(-1.15rem)}
.cb{width:1.15rem;height:1.15rem;border-radius:.375rem;border:2px solid var(--border);display:flex;align-items:center;justify-content:center;flex-shrink:0;transition:.15s;background:transparent}
.cb.on{background:var(--primary);border-color:var(--primary);color:var(--primary-foreground)}
.cb .ic{width:.75rem;height:.75rem;opacity:0}
.cb.on .ic{opacity:1}
input[type=range]{-webkit-appearance:none;appearance:none;width:100%;height:1.5rem;background:transparent}
input[type=range]::-webkit-slider-runnable-track{height:.375rem;border-radius:99px;background:linear-gradient(to left,var(--primary) var(--fill,50%),var(--muted) var(--fill,50%))}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:1.25rem;height:1.25rem;border-radius:99px;background:var(--primary);margin-top:-.4375rem;box-shadow:0 1px 4px rgba(0,0,0,.3)}
.pbar{height:.625rem;border-radius:99px;background:var(--muted);overflow:hidden}
.pbar>i{display:block;height:100%;border-radius:99px;transition:width 1s ease}
.hbar{height:.625rem;border-radius:99px;background:var(--muted);overflow:hidden}
.hbar>i{display:block;height:100%;border-radius:99px;transition:width .3s ease}

/* ─── دیسکلیمر و توست ─── */
.overlay{position:fixed;inset:0;z-index:50;display:flex;align-items:center;justify-content:center;background:rgba(0,0,0,.7);backdrop-filter:blur(4px);padding:1rem}
.dialog{width:100%;max-width:28rem;background:var(--card);border-radius:1.5rem;padding:1.5rem;box-shadow:0 25px 50px -12px rgba(0,0,0,.5)}
#toast{position:fixed;bottom:5.5rem;left:50%;transform:translateX(-50%);z-index:60;display:flex;flex-direction:column;gap:.5rem;align-items:center;pointer-events:none;width:max-content;max-width:90vw}
.toast{background:var(--card);border:1px solid var(--border);border-radius:1rem;padding:.625rem 1rem;font-size:.75rem;font-weight:700;box-shadow:0 10px 25px -5px rgba(0,0,0,.25);animation:fadeUp .25s ease both;display:flex;align-items:center;gap:.5rem}
.toast.ok{border-color:color-mix(in srgb,var(--emerald) 40%,transparent);color:var(--emerald-dark)}
.toast.err{border-color:color-mix(in srgb,var(--destructive) 40%,transparent);color:var(--destructive)}

/* ─── اسکنر سپر ─── */
.gauge{position:relative;display:flex;align-items:center;justify-content:center;width:8rem;height:8rem;margin:0 auto}
.gauge svg{width:8rem;height:8rem;transform:rotate(-90deg)}
.gauge .num{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center}
.gauge .num b{font-size:1.875rem;font-weight:800;line-height:1.2}
.gauge .num span{font-size:.625rem;color:var(--muted-foreground)}
.steplist li{display:flex;align-items:center;justify-content:space-between;gap:.5rem;border-radius:.75rem;background:color-mix(in srgb,var(--muted) 60%,transparent);padding:.5rem .75rem;font-size:.6875rem;line-height:1.25rem}
.stbadge{border-radius:.5rem;padding:.125rem .5rem;font-size:.625rem;font-weight:700;flex-shrink:0}
.st-ok{background:color-mix(in srgb,var(--emerald) 12%,transparent);color:var(--emerald-dark)}
.st-warn{background:color-mix(in srgb,var(--amber) 15%,transparent);color:var(--amber-dark)}
.st-danger{background:color-mix(in srgb,var(--destructive) 15%,transparent);color:var(--destructive)}
.issue{border-radius:1rem;padding:.875rem}
.issue.critical{border:1px solid color-mix(in srgb,var(--destructive) 40%,transparent);background:color-mix(in srgb,var(--destructive) 12%,transparent)}
.issue.high{border:1px solid color-mix(in srgb,var(--destructive) 30%,transparent);background:color-mix(in srgb,var(--destructive) 8%,transparent)}
.issue.medium{border:1px solid color-mix(in srgb,var(--amber) 35%,transparent);background:color-mix(in srgb,var(--amber) 10%,transparent)}
.issue.low{border:1px solid var(--border);background:var(--muted)}
.fixbtn{height:2rem;flex-shrink:0;padding:0 .75rem;border-radius:.75rem;font-size:.6875rem;font-weight:700;background:var(--primary);color:var(--primary-foreground)}
.permtab{display:flex;align-items:center;gap:.375rem;flex-shrink:0;border-radius:.75rem;padding:.5rem .875rem;font-size:.6875rem;font-weight:700;background:var(--secondary);color:var(--muted-foreground);transition:.15s}
.permtab.on{background:var(--primary);color:var(--primary-foreground)}
.pwbox{display:flex;align-items:center;gap:.5rem;border:1px solid color-mix(in srgb,var(--primary) 40%,transparent);background:var(--navy);border-radius:1rem;padding:1rem}
.pwbox code{min-width:0;flex:1;word-break:break-all;text-align:center;font-family:ui-monospace,monospace;font-size:.875rem;font-weight:700;color:var(--primary);direction:ltr}
.dot{width:.5rem;height:.5rem;border-radius:99px}
.stepnum{display:flex;align-items:center;justify-content:center;width:1.25rem;height:1.25rem;flex-shrink:0;border-radius:.5rem;background:var(--primary);font-size:.625rem;font-weight:800;color:var(--primary-foreground);margin-top:.125rem}

/* ─── اسپلش‌اسکرین نئونی ورود به برنامه ─── */
#loading{position:fixed;inset:0;z-index:100;display:flex;flex-direction:column;align-items:center;justify-content:center;overflow:hidden;
  background:#050a18;
  background-image:
    radial-gradient(60rem 40rem at 85% -10%,rgba(56,189,248,.17),transparent 60%),
    radial-gradient(50rem 36rem at 8% 112%,rgba(192,132,252,.15),transparent 60%),
    radial-gradient(40rem 28rem at 50% 50%,rgba(34,211,238,.07),transparent 65%),
    linear-gradient(rgba(56,189,248,.05) 1px,transparent 1px),
    linear-gradient(90deg,rgba(56,189,248,.05) 1px,transparent 1px);
  background-size:100% 100%,100% 100%,100% 100%,2.5rem 2.5rem,2.5rem 2.5rem;
  transition:opacity .6s ease,visibility .6s}
#loading.done{opacity:0;visibility:hidden;pointer-events:none}
/* ذرات نئونی شناور */
#loading .particles{position:absolute;inset:0;pointer-events:none}
#loading .particles i{position:absolute;bottom:-4%;border-radius:99px;display:block;animation:floatUp linear infinite}
@keyframes floatUp{0%{transform:translateY(0) translateX(0);opacity:0}12%{opacity:.9}60%{opacity:.55}100%{transform:translateY(-105vh) translateX(2vw);opacity:0}}
/* مهره مرکزی: آیکون واقعی برنامه + حلقه‌های گردان */
.splash-icon{position:relative;width:9.5rem;height:9.5rem;display:flex;align-items:center;justify-content:center;margin-bottom:1.35rem}
.splash-icon img{width:6.1rem;height:6.1rem;border-radius:1.55rem;position:relative;z-index:3;user-select:none;-webkit-user-drag:none;
  box-shadow:0 0 22px rgba(34,211,238,.5),0 0 58px rgba(192,132,252,.35),0 18px 50px rgba(0,0,0,.6);
  animation:iconIn .75s cubic-bezier(.2,.9,.3,1.35) both,iconGlow 2.3s ease-in-out .8s infinite}
@keyframes iconIn{from{transform:scale(.3) rotate(-16deg);opacity:0}to{transform:scale(1) rotate(0);opacity:1}}
@keyframes iconGlow{0%,100%{box-shadow:0 0 20px rgba(34,211,238,.45),0 0 52px rgba(192,132,252,.3),0 18px 50px rgba(0,0,0,.6)}50%{box-shadow:0 0 34px rgba(34,211,238,.8),0 0 84px rgba(192,132,252,.55),0 18px 50px rgba(0,0,0,.6)}}
.splash-icon .halo{position:absolute;inset:-16%;border-radius:99px;z-index:0;
  background:radial-gradient(circle,rgba(56,189,248,.24),transparent 62%);animation:halo 2.2s ease-in-out infinite}
@keyframes halo{0%,100%{transform:scale(.88);opacity:.5}50%{transform:scale(1.14);opacity:1}}
.splash-icon .ring{position:absolute;border-radius:99px;border:2px solid transparent;z-index:2}
.splash-icon .r1{inset:0;border-top-color:#22d3ee;border-bottom-color:rgba(34,211,238,.25);animation:rotR 1.2s linear infinite;filter:drop-shadow(0 0 6px rgba(34,211,238,.85))}
.splash-icon .r2{inset:.55rem;border-left-color:#c084fc;border-right-color:rgba(192,132,252,.22);animation:rotL 1.55s linear infinite;filter:drop-shadow(0 0 6px rgba(192,132,252,.85))}
.splash-icon .r3{inset:1.1rem;border-top-color:rgba(244,114,182,.95);border-bottom-color:rgba(244,114,182,.2);animation:rotR 2.1s linear infinite;filter:drop-shadow(0 0 5px rgba(244,114,182,.8))}
@keyframes rotR{to{transform:rotate(360deg)}}
@keyframes rotL{to{transform:rotate(-360deg)}}
.splash-icon .pulse{position:absolute;inset:0;border-radius:99px;border:2px solid rgba(34,211,238,.55);animation:pulseOut 1.9s ease-out infinite;z-index:1}
.splash-icon .pulse.p2{animation-delay:.95s;border-color:rgba(192,132,252,.45)}
@keyframes pulseOut{0%{transform:scale(.6);opacity:.95}100%{transform:scale(1.6);opacity:0}}
/* قمرهای نئونی در مدار */
.splash-orbit{position:absolute;inset:-1.35rem;border-radius:99px;animation:rotR 3.3s linear infinite;z-index:1}
.splash-orbit i{position:absolute;top:-.26rem;left:50%;width:.55rem;height:.55rem;margin-left:-.275rem;border-radius:99px;background:#22d3ee;box-shadow:0 0 10px #22d3ee,0 0 24px rgba(34,211,238,.65)}
.splash-orbit.o2{inset:-2.5rem;animation:rotL 4.7s linear infinite}
.splash-orbit.o2 i{background:#e879f9;box-shadow:0 0 10px #e879f9,0 0 24px rgba(232,121,249,.65)}
.splash-orbit.o2 i::after{content:"";position:absolute;top:.55rem;left:.5rem;width:.3rem;height:.3rem;border-radius:99px;background:#67e8f9;box-shadow:0 0 8px #67e8f9}
/* تایپوگرافی نئون */
.splash-title{position:relative;font-size:2.05rem;font-weight:800;letter-spacing:.06em;line-height:1.2;
  background:linear-gradient(120deg,#7dd3fc 12%,#38bdf8 38%,#a78bfa 64%,#f472b6 90%);
  -webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent;
  filter:drop-shadow(0 0 12px rgba(56,189,248,.6)) drop-shadow(0 0 34px rgba(192,132,252,.4));
  animation:titleIn .8s ease .3s both}
@keyframes titleIn{from{opacity:0;transform:translateY(16px) scale(.92)}to{opacity:1;transform:none}}
.splash-sub{margin-top:.35rem;font-size:.78rem;font-weight:500;color:#8ea0c4;animation:fadeUp .6s ease .5s both}
.splash-tag{display:flex;gap:.4rem;margin-top:.85rem;animation:fadeUp .6s ease .62s both}
.splash-tag span{font-size:.62rem;font-weight:700;padding:.22rem .65rem;border-radius:99px}
.splash-tag .t1{border:1px solid rgba(34,211,238,.55);color:#67e8f9;background:rgba(34,211,238,.13);box-shadow:0 0 12px -2px rgba(34,211,238,.7)}
.splash-tag .t2{border:1px solid rgba(192,132,252,.55);color:#d8b4fe;background:rgba(192,132,252,.13);box-shadow:0 0 12px -2px rgba(192,132,252,.6)}
/* نوار پیشرفت گرادیانی */
.splash-bar{width:min(15.5rem,66vw);margin-top:1.55rem;animation:fadeUp .6s ease .72s both}
.splash-bar .track{height:.45rem;border-radius:99px;background:rgba(56,189,248,.13);overflow:hidden;box-shadow:inset 0 1px 4px rgba(0,0,0,.55),0 0 12px -2px rgba(56,189,248,.35)}
.splash-bar .fill{height:100%;width:0%;border-radius:99px;position:relative;
  background:linear-gradient(90deg,#22d3ee,#38bdf8 35%,#c084fc 70%,#f472b6);
  box-shadow:0 0 12px rgba(56,189,248,.85),0 0 28px rgba(192,132,252,.5);transition:width .16s ease}
.splash-bar .fill::after{content:"";position:absolute;inset:0;border-radius:99px;
  background:linear-gradient(90deg,transparent 20%,rgba(255,255,255,.6) 50%,transparent 80%);
  background-size:200% 100%;animation:shimmer 1.1s linear infinite}
@keyframes shimmer{from{background-position:200% 0}to{background-position:-200% 0}}
.splash-meta{display:flex;justify-content:space-between;align-items:center;margin-top:.5rem;font-size:.66rem;color:#64748b}
.splash-meta .pct{color:#67e8f9;font-weight:800;text-shadow:0 0 10px rgba(34,211,238,.7)}
.splash-status{margin-top:.6rem;font-size:.73rem;font-weight:500;color:#94a3b8;min-height:1.25rem;text-align:center;transition:opacity .22s;animation:fadeUp .6s ease .8s both}
.splash-status.swap{opacity:0}
.hidden{display:none!important}
</style>
</head>

const DATA = {"lessons":[{"id":1,"title":"آموزش ساخت رمز عبور قوی","subtitle":"اصول ریاضی و تجربی در طراحی پسوردهایی که زاییده ذهن هکرها و کامپیوترها نیست","icon":"KeyRound","intro":"انتخاب رمزهایی مثل «123456» یا «Ali1380» شبیه به بستن در خانه با فویل آلومینیومی است! هکرها به وسیله حملات واژه‌نامه‌ای و موتورهای محاسباتی قدرتمند، پسوردهای متداول را در کسری از ثانیه حدس می‌زنند. برای استحکام قفل‌ها نیاز به متدهای علمی داریم.","sectionTitle":"فرمول ساخت رمزهای عبور غیرقابل شکستن","text":"یک رمز فولادین حداقل باید دارای ۱۲ کاراکتر ترکیبی باشد ار شامل: حروف انگلیسی بزرگ و کوچک، اعداد، و نمادهای خاص (!@#$%^&*). روش عالی برای حفظ کردن رمزهای سخت، روش «جمله رمز» (Passphrase) است. یک جمله فارسی را به صورت پینگلیش و نماد بنویسید. مثلاً جمله «من عاشق هوش مصنوعی هستم» به این صورت رمزنگاری می‌شود: «MAn@Asheghe#AI*HastAm_1405». این روش هم یادآوری راحتی دارد و هم هک کردن آن قرن‌ها زمان می‌برد!","alert":"از یک کلمه عبور واحد برای چندین سایت یا حساب گوناگون استفاده نکنید! اگر یکی از آن سایت‌ها هک شده و دیتابیس آن لو برود، هکرها بلافاصله آن پسورد را روی جیمیل یا اینستاگرام شما تست خواهند کرد.","note":"برنامه‌های مدیریت رمز عبور (Password Manager) معتبر و آفلاین در اندروید به شما کمک می‌کنند صدها رمز مجزای فوق‌العاده قوی تولید کرده و بدون نیاز به حفظ کردن، آن‌ها را داشته باشید.","mistake":"برخی کاربران رمزهای عبور جدی خود را در بخش یادداشت‌های ساده یا پیام‌های ذخیره شده تلگرام (Saved Messages) نگه می‌دارند که در صورت دسترسی غیرمجاز به جیمیل یا تلگرام، تمام دارایی امنیتی‌شان تبخیر می‌شود.","action":"لیست رمزهای حساب‌های خود را مرور کنید. رمزهای ضعیف یا تکراری را شناسایی کرده و آن‌ها را با الگوی جدید پاس‌فریز تغییر دهید.","summary":"طولانی بودن رمز عبور اثر تصاعدی بیشتری روی افزایش امنیت آن دارد تا استفاده بی‌شمار از نمادهای عجیب. رمزها را طولانی و چند کاراکتری بسازید تا برای همیشه آسوده‌خاطر باشید.","isFree":true,"readMinutes":4},{"id":2,"title":"امنیت حساب‌های بازی و گیمینگ","subtitle":"جلوگیری از دزدیده شدن اکانت پابجی، کالاف دیوتی، کلش‌آوکلنز و استیم","icon":"Gamepad2","intro":"اکانت‌های بازی این روزها حکم سرمایه‌های دیجیتالی ارزشمند را دارند. با ارزش یافتن این حساب‌ها، هکرهای متعددی در کمین نشسته‌اند تا با سرقت اکانت‌ها، آن‌ها را به قیمت‌های نجومی معامله کنند. در این مبیحث با راه‌های دفاع از اکانت‌های بازی آشنا می‌شویم.","sectionTitle":"تله‌های مرگبار جم رایگان و فیشینگ بازیکنان","text":"مشهورترین روش هک اکانت‌های بازی، تبلیغ کلمات کلیدی نظیر «جم رایگان پابجی»، «کدهای پنهانی کالاف دیوتی» یا «روش هک بازی جنگ قبیله‌ها» است. هکرها با ایجاد صفحات جعلی فیشینگ، شما را تشویق می‌کنند که برای گرفتن جم هدیه حتماً رمز عبور اکانت جیمیل یا سوپرسل‌آیدی خود را بنویسید. به محض تایپ رمز، اکانت شما برای همیشه قفل و ربوده می‌گردد!","alert":"هرگز خارج از بازی به هیچ وب‌سایتی برای قرعه‌کشی‌های جم رایگان رمز ندهید. کارهای درون‌برنامه‌ای پرداخت بازی فقط و فقط از طریق درگاه‌های متبر تایید هویت شده انجام می‌پذیرد.","note":"فعال کردن تایید دو مرحله‌ای (Two-Step Auth) روی حساب کاربری گوگل‌پلی، سوپرسل یا ابل‌آیدی متصل به اکانت‌های بازی، هر نوع حمله از راه دور را خنثی خواهد کرد.","mistake":"خرید و فروش خودسرانه کارهای بازی از طریق دایرکت اینستاگرام یا کانال‌های واسط معمولی، بدون حضور در مراجع و پورتال‌های دارای اینماد و صلح معامله.","action":"به تنظیمات حساب سوپرسل ایدی یا اکتیویژن متصل به بازی خود رفته و بررسی کنید که فعالسازی Two-Factor روشن باشد و ایمیل بازیابی به هیچ وجه متفرقه نباشد.","summary":"هیچ هدیه‌ی طلایی مجانی در اینترنت وجود ندارد. با دور کردن تمایلات عاطفی جم رایگان، از حساب‌های گیمینگ خود مقتدرانه صیانت به عمل آورید.","isFree":false,"readMinutes":4},{"id":3,"title":"امنیت و رفع هک اینستاگرام","subtitle":"محافظت از پیج‌های شخصی و کاری در برابر نفوذ، دزدی اطلاعات و دی‌اکتیو شدن","icon":"Instagram","intro":"اینستاگرام به عنوان شبکه تعاملات اجتماعی، آلبوم زندگی شما و بستر تجارت کسب‌وکارهای کوچک و بزرگ است. از دست رفتن پیج یعنی نابودی زحمات چندین ساله و باج‌گیری‌های مفرط مالی. این مقاله علمی تمام روش‌های بازدارنده این نفوذ را شرح می‌دهد.","sectionTitle":"ارکان دفاع پیج در مقابل حملات هکرهای کپی","text":"نقاط حساس نشت اینستاگرام شامل ۳ حوزه اصلی است: رمزهای عبور ضعیف و تکراری، پیوست ایمیل یا جیمیل فاقد امنیت و سوم اتصال به برنامه‌های غیررسمی آنفالویاب یا فالوربگیر مجهز به بدافزارها. هکرها با ربودن نام کاربری و تغییر ایمیل پشتیبان به نام خودشان، پیج شما را به کلی قفل می‌کنند. کنترل مداوم منوی Where you're logged in برای شناسایی هر نوع نشت مکانی تبلت‌ها و گوشی‌ها الزامی است.","alert":"پیام‌هایی حاوی تایید هویت پیج برای گرفتن تیک آبی بالا، یا هشدارهای تقلبی نقض کپی رایت با لینک مشکوک، دام‌های فیشینگ بزرگی هستند که پیج شما را در چند ثانیه تبخیر می‌سازند.","note":"پشتیبانی رسمی کدهای بازیابی نهایی (Recovery Codes) داخل اینستاگرام را حتماً به صورت فیزیکی کپی کرده یا عکس آن را در هارد آفلاین قرار دهید تا در بروز هر باگی صاحب پیوند باشید.","mistake":"بسیاری از به اصطلاح ادمین‌های امنیتی برای افزایش سرعت چت‌ها، نام کاربری و پسورد مستقیم پیج را به راحتی در اختیار چندین بازاریاب بدون بکارگیری سیستم‌های امن قرار می‌دهند.","action":"وارد تنظیمات Settings -> Accounts Center -> Password and Security شده، بخش Where you're logged in را چک کرده و دستگاه‌های ناشناس را پاک کرده و تایید دو مرحله‌ای (Two-Factor) را روشن کنید.","summary":"گذر واژه‌های قوی به همراه ایمیل پشتیبان معتبر و تایید دو مرحله‌ای، زره پولادینی بر تن پیج شما خواهد پوشاند که قوی‌ترین هکرها نیز از هجمه به آن منصرف خواهند شد.","isFree":true,"readMinutes":5},{"id":4,"title":"امنیت و رفع هک تلگرام","subtitle":"امضای دیجیتال تلگرام خود را محکم کنید و به کانال‌های مخرب خاتمه دهید","icon":"Send","intro":"تلگرام به واسطه ویژگی‌های بسیار پیشرفته توسعه خود، مورد توجه کلاهبرداران و هکرهای حرفه‌ای است. به سرقت رفتن اکانت تلگرام یعنی نابودی کانال‌ها، گروه‌ها، فاش شدن چت‌های محرمانه و کارهای آبرومندانه. با پاره کردن زنجیره موازی دسترسی‌ها، تلگرام را عایق‌کاری کنید.","sectionTitle":"تله‌های تایید هویت و ممیزی نشست‌های فعال","text":"شیوه کار هکرهای تلگرام بدین گونه است: پیامکی فریبکارانه به شما می‌دهند که «شما برنده جایزه شده‌اید برای تایید مشخصات کد ارسالی تلگرام را وارد کنید.» به محض دادن کد تلگرام، فرد به موازات شما وارد اکانت گردیده و برای جلوگیری از باطل کردن دسترسی، رمز دوم انتخابی خود را می‌سازد! بخش حیاتی پایش تلگرام، منوی Active Sessions است که لیست زنده تمام دستگاه‌های متصل را فاش می‌کند.","alert":"هیچ شرکت یا کانال تلگرامی و پشتیبان رسمی هرگز کدهای تایید تلگرام را تقاضا نمی‌کند. همچنین به محض دیدن پیام ورود دستگاه ناشناس به حسابتان (از طرف بات رسمی تلگرام)، فوراً اقدام کنید.","note":"آیکون قفل محلی درون چت‌های تلگرام به شما امکان می‌دهد برای نرم‌افزار خود پین ورودی اختصاصی بگذارید تا دیگران در زمان دوری شما دسترسی نیابند.","mistake":"استفاده مطلق از نسخه‌های غیررسمی تلگرام (مانند موبوگرام، تلگرام طلایی، ضد فیلتر و...) که متصل به پروکسی‌های اجباری هستند و می‌توانند بی اراده شما، چنل بسازند یا شما را عضو گروه‌های متفرقه کنند.","action":"به چیدمان تلگرام خود بروید، مسیر Settings -> Privacy and Security -> Active Sessions را فشرده و با انتخاب گزینه Terminate all other sessions تمام کلاه‌برداران را از حساب باطل کنید.","summary":"بزرگترین سپر تدافعی تلگرام، هوشیاری در عدم تقدیم کدهای ورودی به غریبه‌ها و بکارگیری نسخه رسمی است. حریم شخصی خود را بی الگو رها نکنید.","isFree":false,"readMinutes":4},{"id":5,"title":"امنیت و رفع هک جیمیل","subtitle":"جلوگیری از خوانده شدن ایمیل‌های شخصی و تاییدهای حساب شما","icon":"Mail","intro":"جیمیل (Gmail) فراتر از یک صندوق پستی ساده است. جیمیل کلید ریست کردن کلمه عبور اینستاگرام، تلگرام، حساب‌های ارزی و حتی پرتک‌های بانکی شماست. هکرها با نفوذ پنهانی به جیمیل، مایلند مکاتبات مالی و کدهای تغییر رمز را مانیتور کنند. این بخش برای بستن این حفره‌هاست.","sectionTitle":"بررسی فیلترها و کارهای پنهان در پنل وب جیمیل","text":"روش جالبی که هکرهای باهوش به کار می‌برند، استفاده از بخش Forwarding و ایجاد فیلترهای مخفی است. آن‌ها به صورتی فیلتر تنظیم می‌کنند که هر رمزی که مایل به بازیابی آن روی حساب اینستاگرام یا صرافی هستید، ایمیل حاوی کد دریافت کند و بلافاصله به جیمیل هکر فوروارد شود و نسخه واریزی از اینباکس اصلی شما کاملاً حذف (Trash) گردد تا متوجه ایمیل نشوید! این یک تهدید خاموش است.","alert":"اگر پیامکی با عنوان درخواست ریست پسورد حساب‌های دیگر دریافت کردید اما وقتی وارد جیمیل شدید نامه‌ای مربوط به آن نیافتید، سریعاً باید فیلترهای جیمیل و بخش فورواردینگ را در نسخه تحت وب کنترل کنید.","note":"جیمیل مجهز به ابزار امنیتی Google Security Checkup است که با اسکن پویای سیستم، تمامی موارد مشکوک اکانت را با یک دکمه رفع اشکال می‌کند.","mistake":"استفاده از اپلیکیشن‌های جانبی مدیریت ایمیل (Email Client) که ادعا می‌کنند کار با جیمیل را برای شما آسان می‌کنند اما رمز جیمیل شما را در سرور اصلی خود نگهداری می‌کنند.","action":"از طریق مرورگر رایانه یا موبایل وارد نسخه وب جیمیل شوید (Gmail Web Interface)، چرخ‌دنده تنظیمات را زده و تب Filters and Blocked Addresses را بررسی کرده و فیلترهای مشکوک را لغو کنید.","summary":"ورودی‌های پاکیزه جیمیل به معنای صیانت از تمام دارایی‌های متصل است. با ممیزی فیلترها و مسیربست‌های انتقال داده، به امنیت حداکثری دست یابید.","isFree":false,"readMinutes":4},{"id":6,"title":"سوالات پرتکرار امنیتی (FAQ)","subtitle":"پاسخ به رایج‌ترین شبهات و ابهامات در دنیای امنیت اطلاعات گوشی‌های همراه","icon":"HelpCircle","intro":"دنیای امنیت پر از شبهات، شایعات عوامانه و کارهای عجیب است. برای افزایش آگاهی سایبری، کالبدشکافی پرسش‌های رایج را با اتکا به مراجع فنی و منطبق با معماری اندروید در این بخش پاسخ می‌دهیم تا حقایق را بشناسید.","sectionTitle":"حقایق فاش شده در پرسش و پاسخ‌های امنیتی دستگاه‌ها","text":"سوال: آیا هک گوشی اندروید از راه دور بی هیچ کلیک یا دانلودی امکان‌پذیر است؟ پاسخ: کدهای نفوذ از راه دور محض (Zero-Click) در انحصار کلان سازمان‌های جاسوسی بین‌المللی است و هزینه هر بار اجرای آن مبالغ میلیون دلاری پورتال است. برای کاربران عادی، هک بدون باز کردن لینک فیشینگ یا دانلود نمودن برنامه‌های مشکوک پنهان عملاً صفر مینی‌موم است.","alert":"سوال: اگر ناآگاهانه کد تایید یا لینک فیشینگ را فشرده و لمس کردیم چه کنیم؟ پاسخ مهم: فوراً اتصال اینترنت گوشی را خاموش کنید، اکانت‌های متصل چت را با مراجع Sessions دیگر قطع کنید، سریعاً نسبت به خالی کردن موجودی کارت یا انتقال آن اقدام کنید.","note":"سوال: برنامه‌های روت کردن گوشی اندروید چه خطراتی دارند؟ پاسخ: روت کردن لایه‌های محافظتی کرنل سیستم‌عامل اندروید را به کلی کنار زده و به بدافزارهای ساده اجازه خواندن فایل‌های حساس تمام برنامه‌ها را صادر می‌کند!","mistake":"باور به این شایعه که با گذاشتن لایسنس یا داشتن آنتی‌ویروس، می‌توانیم با ایمنی فیزیکی کامل روی تمام وب‌سایت‌های مخرب بدون تامل و تفکر کلیک کنیم.","action":"هر زمان در مواجه با برنامه‌ای مردد بودید، آن را روی موتور آنلاین VirusTotal قرار دهید تا ۶۰ آنتی‌ویروس بزرگ زنده جهان فایل را به ثانیه بررسی نمایند.","summary":"شایعات و فوبیاهای ذهنی را دور بریزید. امنیت بر پایه معماری منطق ریاضی شکل گرفته است. با ارتقا آگاهی، قوى‌ترین ناظر تدافعی دستگاه خود باشید.","isFree":false,"readMinutes":5},{"id":7,"title":"امنیت کودکان و نوجوانان در وب","subtitle":"ایمن‌سازی فضای اینترنت برای رده‌های سنی حساس و روش‌های علمی و عملی کنترل والدین","icon":"Baby","intro":"دنیای مجازی دنیایی از ارتباط‌هاست؛ با این وجود کودکان و نوجوانان به دلیل احساسات هیجانی، طعمه‌های فوق‌العاده ساده‌ای برای منحرفان سایبری، هکرها و کلاهبرداران در بستر بازی‌های آنلاین هستند. صیانت از روان و اطلاعات فرزندان، رسالت والدینی آگاه است.","sectionTitle":"سپر دفاعی فرزندان و متدهای کنترل آفلاین والدین","text":"تنظیم بستر ایمن نیازمند دو سلاح گوناگون است: نخست گفتگوهای رفیقانه و آگاه‌سازی به کودک که بداند «اینترنت حیاط‌خلوت عمومی است و نباید اطلاعات خانه را فاش کند.» ابزار دوم بکارگیری قوی‌ترین کنترل والدین اندروید یعنی Google Family Link است. این برنامه به شما اصرار زنده دارد تا بر مدیریت نصب بازی‌ها، مدت زمان نگاه کردن و مسدودسازی پیوندهای نامتعارف، نظارت مستقیم و بدون تشنج داشته باشید.","alert":"نوجوانان نباید برای بازی‌ها یا چت در شبکه‌های بیگانه، اطلاعاتی شامل آدرس فیزیکی منزل، مدرسه، وضعیت اموال فامیل و به خصوص عکس‌های خانوادگی در گالری را به دوستان ناشناس آنلاین بفرستند.","note":"پیکربندی قابلیت SafeSearch روی موتور جستجوی گوگل کروم کودک به شما این برائت را می‌دهد تا از نمایش هر نوع فیلم یا عکس‌های مستهجن و خشن به صورت خودکار جلوگیری به عمل آید.","mistake":"خریدن تبلت یا سیم‌کارت بدون محدودیت محتوایی و رها کردن فرزند خردسال در فضای بدون چارچوب وب برای ساعت‌های طولانی به عنوان تفریح و بازی.","action":"نرم‌افزار Google Family Link را از گوگل پلی ریخته و روی گوشی خود و فرزندتان ارتباط را متمایز فعال کرده و فیلترهای وب برای سنین زیر ۱۸ سال را ست کنید.","summary":"امور پرورشی نوین به کنترل‌های نامحسوس و تکنولوژی مجهز متکی است. با عایق‌سازی پورتال وب کودکان خود، آرامش و سلامت روان را به خانواده هدیه دهید.","isFree":false,"readMinutes":5},{"id":8,"title":"امنیت و رفع هک روبیکا","subtitle":"حفظ حریم خصوصی و امنیت حساب کاربری در پیام‌رسان روبیکا","icon":"MessageCircle","intro":"سوپراپلیکیشن روبیکا بستر مبادلات اجتماعی بخش بزرگی از کاربران بومی است. اما به دلیل ناآگاهی عمومی خریداران، کلاهبرداران به شدت مایل به تسخیر حساب‌ها و تبلیغ به نام اکانت قربانی هستند. این بخش شما را به دفاع مقابل سارقان مجهز می‌سازد.","sectionTitle":"متدهای جعل پشتیبان و پایش سیستم‌های امنیتی","text":"کلاهبرداران در روبیکا معمولاً عکسی با نشان رسمی روبیکا قرار داده و با نام‌های فریبنده مثل «سامانه مرکزی پشتیبانی روبیکا» پیام می‌دهند که «حساب شما به علت تخلف در حال حذف شدن است، جهت لغو حذف سریعاً کد ۵ رقمی ارسالی به تلفن را بفرستید.» فرستادن کد مساوی ورود هکرها به اکانت است. بخش حیاتی ممیزی روبیکا منوی «دستگاه‌های فعال» است که رد کل مهمانان ناخوانده را فاش می‌کند.","alert":"هیچ دایره یا نماینده یا ادمین پشتیبان روبیکایی کد ارسالی پیامکی را تقاضا نخواهد کرد. همیشه توجه کنید حساب پشتیبان رسمی در روبیکا دارای نشان تایید آبی رنگ است.","note":"گذاشتن گذرواژه تایید دومرحله‌ای متنی سخت در بخش تنظیمات حریم خصوصی روبیکا سد بسیار قدرتمندی مقابل بات‌ها و نفوذگران است.","mistake":"نصب برنامه‌های ثانویه نظیر «روبیکا همه‌کاره» یا «روبیکا پرو طلایی پلاس» که از طرف مارکت‌های مجهول منتشر شده و هدف آن‌ها برداشت کدهای ورود شماست.","action":"به چیدمان روبیکای خود رفته، بخش «تنظیمات -> حریم خصوصی و امنیت -> دستگاه‌های فعال» را فشرده و با زدن دکمه خروج از سایر دستگاه‌ها، کانورت امن انجام دهید.","summary":"آگاهی، سپر امنیت شما در روبیکاست. چشمان خود را در مواجهه با پیام‌های جعلی باز نگه دارید و چت‌های خود را فاقد دسترسی دیگران نگه دارید.","isFree":false,"readMinutes":4},{"id":9,"title":"امنیت گوشی اندروید","subtitle":"کارهای ضروری و تنظیماتی که باید فوراً در گوشی خود تغییر دهید","icon":"Smartphone","intro":"سیستم‌عامل اندروید به واسطه منبع‌باز بودن، آزادی عملی بی‌نظیر به کاربر می‌دهد. اما همین ویژگی، در صورت پیکربندی غلط تنظیمات گوشی، بستر مناسبی برای بدافزارها و تراست‌های جاسوسی است. با چند دقیقه چیدمان صحیح، گوشی اندرویدی خود را تبدیل به پناهگاهی امن بسازید.","sectionTitle":"منظومه پدافندی اندروید: ابزارها و تنظیمات بنیادی","text":"اندروید دارای بخش‌های حفاظتی پنهانی است. اولین دفاع، غیرفعال بودن کامل نصب از مراجع ناشناس برای پیام‌رسان‌ها است. بدافزارهای جاسوسی معمولاً دوست دارند فولدری بسازند و فایل‌های آلوده را دانلود کنند. ویژگی دوم، سپر امنیتی فعال Google Play Protect است که با الگوهای تحلیل رفتاری، کدهای مخرب را به سرعت متلاشی و مسدود می‌کند. ابزار سوم نیز ممیزی وضعیت Developer Options و گزینه‌ی اشکال‌زدایی USB است.","alert":"اشکال‌زدایی USB (USB Debugging) را زمانی که استفاده ندارید حتماً خاموش نگه دارید. سارقان فیزیکی با اتصال کابل به رایانه‌های مجهز و درگاه اشکال‌زدایی فعال، می‌توانند قفل الگوی صفحه گوشی شما را بدون داشتن رمز عبور دور بزنند.","note":"همواره دسترسی‌های اختصاصی همچون Notification Listener یا Accessibility Services را در گوشی برای برنامه‌های نصب شده ممیزی کنید. این موارد مسیر نشت داده‌ها را برای بدافزارها هموار می‌سازند.","mistake":"بسیاری از کاربران برای تسریع کارهای خود دسترسی نصب برنامه‌ها را برای مراجع ناشناس (مانند فایرفاکس یا تلگرام) روشن می‌گذارند و پس از اتمام کار، آن را مجدداً قفل نمی‌کنند.","action":"وارد تنظیمات اندروید شده، بخش Google -> Security -> Google Play Protect را باز کنید و گزینه Scan apps with Play Protect را فعال نمایید.","summary":"شما با بستن راه‌های نفوذ فیزیکی و سیستمی اندروید، ضریب امنیت خود را تا بی نهایت افزایش خواهید داد. یک اندروید مجهز، ایمن‌ترین سیستم‌عامل موبایلی است.","isFree":true,"readMinutes":5},{"id":10,"title":"امنیت و رفع هک شاد","subtitle":"حفظ حریم خصوصی دانش‌آموزان و دبیران ارجمند در اپلیکیشن شاد","icon":"GraduationCap","intro":"شبکه آموزشی دانش‌آموزی شاد کانون اتصالات تحصیلی فرزندان کشور است. اما متأسفانه به خاطر سنین پایین و سادگی مخاطبان دانش‌آموز، جولانگاه کلاهبرداران عاطفی با ترفندهای مهندسی اجتماعی شده است. صیانت از اکانت دانش‌آموزی وظیفه والدین و کادر مدرسه است.","sectionTitle":"کلاهبرداری‌های بهانه‌ای و ممیزی بستار شاد","text":"حیله تکراری هکرها در شبکه شاد پیامک زدن به دانش‌آموز با نام «پشتیبانی بخش فنی شاد» است با این مضمون: «پرونده تحصیلی شما ناقص است و اگر کد تایید پیامک شده را تا ۵ دقیقه دیگر ارسال نکنید از کلاس‌های درس حذف می‌شوید.» اکثر کودکان با اضطراب کد را تسلیم هکر می‌نمایند! ادمین شدن هکرها در گروه‌های درسی به دزدیدن اطلاعات دانش‌آموزان دیگر می‌انجامد که فاجعه‌بار است.","alert":"کادر اجرایی مدارس، مدیران، ناظمین و معلمان گرامی هرگز برای عضویت در کانال‌های کلاس یا تایید پرونده‌ها کدهای پیامکی تایید شاد را درخواست نخواهند کرد.","note":"بررسی چیدمان «دستگاه‌های فعال» در شاد به والدین امکان می‌دهد رفتارهای نفوذی را در سریع‌ترین زمان مانیتور و خنثی کنند.","mistake":"دادن استقلال کامل تبلت بدون ردیابی مکرر بخشهای حریم خصوصی شاد توسط پدر و مادر و غفلت از چت‌های پنهان نوجوان با هویت‌های دروغین در بازی‌ها.","action":"در گوشی فرزند خود پیام‌رسان شاد را بررسی کرده، بخش «تنظیمات -> حریم خصوصی -> دستگاه‌های فعال» را ممیزی کنید و ایمنی تایید دو مرحله‌ای آن را ست فرمایید.","summary":"حملات مهندسی عاطفی هدف شماره یک در شاد است. با آموزش مبانی ساده امنیت سایبری به کودکان، کانون خانواده را از دغدغه‌ها دور نگه دارید.","isFree":false,"readMinutes":4},{"id":11,"title":"تشخیص لینک و سایت جعلی","subtitle":"شناسایی کلاهبرداری‌های اینترنتی فیشینگ در یک ثانیه","icon":"Fish","intro":"فیشینگ (Phishing) هنر فریب دادن کاربر است. هکرها وب‌سایتی مو به مو و کاملاً مشابه درگاه بانکی یا شبکه‌های اجتماعی اصلی می‌سازند، سپس با بهانه‌های تحریک‌کننده یا تهدیدآور، شما را به آنجا سوق می‌دهند تا مشخصات کارت و پسورد خود را شخصاً تایپ کنید.","sectionTitle":"۴ نشانه طلایی برای صحت‌سنجی یک درگاه اینترنتی","text":"نشانه اول، بررسی ریز به ریز آدرس بار (URL) مرورگر است. به عنوان مثال، آدرس حقیقی سامانه شاپرک shaparak.ir است؛ اما کلاهبرداران دامنه‌های عجیبی مانند shapaarak.ir ، shapeerak-ir.icu یا shapesrak.ir را ثبت می‌کنند. نشانه دوم، نبود پروتکل HTTPS است (روشن نبودن قفل امنیت در نوار بالای مرورگر). نشانه سوم، بخش کد امنیتی (کپچا) است؛ تصاویر کپچای جعلی ثابت بوده و با کلیک روی دکمه لود مجدد، ارقام آن عوض نمی‌شوند!","alert":"هرگز از درون لینک‌های ارسالی در پیامک‌ها وارد سایت‌های با تراکنش مالی نشوید. برای ورود به بانک خود، همواره نام بانک را در مرورگر تایپ کنید یا از اپلیکیشن رسمی بانک همراه استفاده فرمایید.","note":"نصب یک افزونه ضد فیشینگ معتبر روی مرورگر وب یا استفاده از مرورگرهای نوین اندرویدی مجهز به فیلتر هشدارهای مشکوک، بخش بزرگی از حملات فیشینگ را به صورت زنده خنثی خواهد کرد.","mistake":"برخی کاربران صرفاً با دیدن لوگوهای آشنای شاپرک و نماد اعتماد روی صفحه، اطمینان کامل پیدا می‌کنند؛ در صورتی که کدهای قالب این نشان‌ها به آسانی قابل کپی روی صفحات کلاه‌برداری است.","action":"برای خریدهای اینترنتی خود، یک کارت بانکی جانبی اختصاص دهید و سقف موجودی آن را همواره زیر ۵۰ هزار تومان نگه دارید تا در صورت افتادن در تله فیشینگ، سرمایه اصلی‌تان مصون بماند.","summary":"فضای آنلاین پر از درهای پشتی و تله‌های عاطفی-عناینی است. با چند ثانیه تمرکز روی آدرس دامنه و آیکون قفل، جلوی خالی شدن حساب خود را مقتدرانه سد کنید.","isFree":true,"readMinutes":5},{"id":12,"title":"امنیت ویندوز و کامپیوتر","subtitle":"محافظت از لپ‌تاپ و کامپیوتر خانگی در برابر باج‌افزارها و استخراج‌کننده‌های رمز ارز","icon":"Monitor","intro":"نه تنها گوشی هوشمند، بلکه مغز پردازشی کارهای اداری و فنی شما یعنی رایانه‌ها هدف حملات تخریبی هستند. ویندوزها به دلیل بکارگیری گسترده، بستر تاخت و تاز باج‌افزارها (Ransomware) هستند که تمام عکس‌ها و مستندات خانوادگی را قفل کرده و از شما پول طلب می‌کنند.","sectionTitle":"اصول زنده نگه‌داری ویندوز از غارت اطلاعات","text":"دشمن بزرگ امنیت ویندوز، نفوذ کرک‌های نرم‌افزارهای غیرمجاز و دانلود شده از منابع نامطمئن است. این کرک‌ها اغلب کدهای کی‌لاگر را با خود همراه دارند که پسوردهای ذخیره شده در مرورگرهای وب را کپی و خارج می‌کنند. تکیه‌گاه پایه ویندوز، فعال بودن دائمی Windows Defender و دانلود منظم آپدیت‌های پچ امنیتی سیستم‌عامل از پورتال رسمی مایکروسافت است.","alert":"هرگز فایلهای پیوستی با پسوندهای مشکوک نظیر .exe ، .scr یا .bat پیوستی در ایمیل‌های غریبه یا فایل‌های فشرده تلگرامی را روی ویندوز اجرا نکنید، زیرا آسیب‌پذیری‌های لایه‌ای فایل زنده خواهند شد.","note":"داشتن هارد اکسترنال جانبی و گرفتن بکاپ فیزیکی منظم قطع به یقین بهترین و تنهاترین داروی خنثی‌سازی حملات فاجعه‌بار باج‌افزارها در سیستم‌هاست.","mistake":"غیرفعال کردن آنتی‌ویروس اصلی سیستم برای نصب بازی‌های کرک‌شده و عدم یادآوری فعالسازی مجدد آن پس از کارهای تفریحی و بازی.","action":"به بخش Windows Security سیستم خود مراجعه کنید، از روشن بودن بخش‌های Virus & threat protection مطمئن شوید و یک تست ممیزی سریع (Quick Scan) برای سیستم استارت کنید.","summary":"رایانه‌ها حاوی آرشیو زندگی و کارهای شما هستند. با بکارگیری ویندوز مجهز به وصله امنیتی نوین و دوری از کرک‌های سیاه، کامپیوتر خود را فاقد حفره نگه دارید.","isFree":false,"readMinutes":4},{"id":13,"title":"امنیت و رفع هک پیامک و سیمکارت","subtitle":"چگونه مانع از شنود پیامک‌های تایید حساب خود توسط هکرها شویم؟","icon":"SimCard","intro":"هویت دیجیتال شما به سیم‌کارتتان متصل است. پیامک‌های کد تایید یا احراز ورود دروازه ورود به تلگرام، واتساپ، جیمیل و فرآیندهای مالی بانک‌ها هستند. مهاجمان با فریب دادن اپراتور یا نصب بدافزارها می‌توانند به راحتی پیامک‌ها را شنود کنند. باید سیم‌کارت خود را در دژ دفاعی قرار دهید.","sectionTitle":"راهکارهای شنود پیامک و فرامین بازدارنده","text":"اولین تکنیک هکرها، نصب برنامه‌های فوروارد کننده (SMS Forwarder) به صورت پنهانی روی گوشی قربانی است. این اپلیکیشن‌های موذی با گرفتن دسترسی پیامک، بلافاصله هر اس‌ام‌اس دریافتی را به شماره مهاجم یا کانال تلگرامی و روبیکایی فوروارد می‌کنند و اثری در گالری سابقه نمی‌گذارند. خطر دوم، سیم‌کارت فاقد پین کد برای زمان گم شدن فیزیکی گوشی است. با انداختن سیم‌کارت روی گوشی جانبی دیگر، سارق فوراً رمز اصلی همه اکانت‌های شما را تقاضا می‌کند.","alert":"اگر به ناگاه با قطع دائم شبکه آنتن گوشی خود بدون دلیل سخت‌افزاری روبرو شدید، فوراً با سیم‌کارت دیگری به اپراتور تماس بگیرید. ممکن است سارقان با اوراق هویتی و جعل، سیم‌کارت جدید به نام شما صادر کرده باشند (حمله SIM Swap).","note":"پیکربندی پین کد سیم‌کارت کارهای شخصی (PIN SIM) به شما کمک می‌کند جلوی سرقت سیم‌کارت فیزیکی را به صورت کامل ببندید.","mistake":"استفاده از برنامه‌های پیام‌رسان پیش‌فرض جانبی غیراستاندارد به جز برنامه اصلی خود شرکت‌های سازنده موبایل (مانند Google Messages) که معمولاً با کدهای منبع‌باز غیررسمی توسعه یافته‌اند.","action":"در گوشی خود به بخش تنظیمات امنیتی (SIM Card Lock) بروید و برای سیم‌کارت خود یک پین کد ۴ رقمی اختصاص دهید و همچنین برنامه‌های دارای دسترسی پیامک را ممیزی کنید.","summary":"سیم‌کارت شما قلب مدار تایید هویت است. با افزودن پین حفاظتی فیزیکی و ممیزی بسته‌های پکیج، دروازه ورودی هکرها را برای همیشه چفت و محکم کنید.","isFree":false,"readMinutes":5},{"id":14,"title":"تشخیص هک شدن گوشی","subtitle":"نشانه‌های واضحی که خبر از وجود بدافزار یا جاسوس‌افزار در گوشی می‌دهند","icon":"Bug","intro":"هکرها مایلند در سایه حضور یابند. بدافزارهای جاسوسی پیشرفته تلاش می‌کنند ردی از خود بجای نگذارند، اما رفتار سخت‌افزار موبایل دست آن‌ها را رو می‌کند. با یادگیری رفتارهای فیزیکی گوشی، به چشم مسلح تشخیص نفوذ مجهز شوید.","sectionTitle":"ردپای بدافزارها: نشانگرهای سخت‌افزاری و نرم‌افزاری","text":"وقتی یک پردازش مخرب در پس‌زمینه اندروید در حال مانیتورینگ میکروفون، جی‌پی‌اس و گالری شماست، منابع سیستم را به شدت اشغال می‌کند. این اشغال منابع به ۳ شکل واضح خود را نشان می‌دهد: ۱. تخلیه سریع و ناگهانی باتری حتی زمانی که با گوشی کاری ندارید. ۲. گرم شدن و داغ کردن بی‌دلیل بدنه فلزی گوشی در شرایط بلااستفاده بودن مطلق. ۳. مصرف نجومی و بدون پیش‌زمینه حجم ترافیک اینترنت به دلیل آپلود مدام فایل‌های جاسوسی شده به سمت سرورهای خارجی.","alert":"اگر متوجه شدید در نوار اعلان اندروید، چراغک چشمک‌زن کوچک مربوط به دوربین یا میکروفون (نقطه سبز رنگ در اندرویدهای نوین) بی‌جهت روشن شده است، نشانه‌دهنده استراق سمع زنده توسط یکی از اپلیکیشن‌ها است!","note":"برنامه‌های ضدبدافزار معتبر آفلاین می‌توانند پردازش‌های عمیق لایه‌ی کرنل اندروید را مرتباً پایش کنند و در صورت مشاهده رفتارهای مشکوک، هشدار امنیتی فوری صادر کنند.","mistake":"برخی کاربران داغ کردن مفرط گوشی یا مصرف بی‌رویه دیتا را صرفاً به افت کیفیت فنی سخت‌افزار ربط می‌دهند و این موارد ممیزی حساسیت امنیتی را جدی تلقی نمی‌کنند.","action":"وارد بخش مانیتورینگ ترافیک اینترنت (Data Usage) در تنظیمات اندروید شوید و حجم مصرف هر برنامه در پس‌زمینه (Background Data) را ممیزی کنید. هر برنامه ناشناسی را که مصرف بیش از حد داشت فوراً حذف نصب کنید.","summary":"گوشی شما هرگز بیهوده داغ نمی‌شود یا دیتای آن مفقود نمی‌گردد. هر رفتار غیرعادی را به عنوان زنگ خطری جدی تلقی کرده و به بررسی تخصصی بپردازید.","isFree":false,"readMinutes":5},{"id":15,"title":"امنیت و رفع هک واتساپ","subtitle":"شناسایی سریع دستگاه‌های متصل به واتساپ شما و افزایش حریم خصوصی چت‌ها","icon":"MessageSquare","intro":"واتساپ از پروتکل رمزنگاری سرتاسری برخوردار است، به این معنی که پیام‌ها حین جابجایی در اینترنت قابل شنود نیستند. اما بدافزارها و جاسوس‌ها از غفلت فیزیکی شما استفاده می‌کنند تا به پیام‌های جاری متصل شوند. این راهنما به معرفی و رفع این تهدیدها می‌پردازد.","sectionTitle":"نشست‌های وب و دستگاه‌های متصل واتساپ","text":"بزرگترین دریچه نفوذ به واتساپ، اسکن کردن بارکد تصویری در زمان اتصال مرورگر لپ‌تاپ (WhatsApp Web) است. سارق می‌تواند با یک ثانیه غفلت شما پیوند چنل را برقرار کرده و تمام چت‌های زنده شما را مانیتور و حتی از طرف شما پیام ارسال کند. خطر دوم، نرم‌افزارهای بکاپ‌گیر مخفی هستند که دسترسی به فایلهای پوشه‌ واتساپ در حافظه گوشی دارند و چت‌ها را خارج می‌کنند.","alert":"روشن شدن ناگهانی هشدار «WhatsApp Web is currently active» روی نوتیفیکیشن‌ها اندروید زنگ خطری جدی است که خبر می‌دهد شخصی همین الان در حال خواندن پیام‌های شما از طریق رایانه است.","note":"تنظیم پین کد شخصی تایید دومرحله‌ای درون واتساپ برای جلوگیری از جابجایی مکرر سیم‌کارت و نفوذ مجدد فوق‌العاده الزامی است.","mistake":"مهمترین اشتباه سپردن گوشی فاقد الگو یا قفل به دیگران (افراد فامیل یا سارقان گذری) حتی برای کارهای ساده است، چرا که اتصال واتساپ وب تنها ۱۰ ثانیه زمان می‌طلبد!","action":"همین الان واتساپ خود را باز کنید، به بخش Linked Devices (دستگاه‌های متصل) بروید؛ لیست تمام مرورگرها را چک کنید و با زدن دکمه Log Out تمام آنها را بیرون بیندازید.","summary":"بدون تایید صریح دوربین شما، هک واتساپ برای افراد عادی محال است. با مراقبت از فیزیک گوشی و بستن نشست‌های فعال وب، کنترل چات‌ها را به دست بگیرید.","isFree":false,"readMinutes":4},{"id":16,"title":"احراز هویت دو مرحله‌ای (2FA)","subtitle":"امنیت دوبرابر حساب‌ها و جلوگیری از ورود هکرها حتی در صورت فاش شدن پسورد","icon":"ShieldCheck","intro":"پسوردها به تنهایی بستر مناسبی برای هک هستند. احراز هویت دو مرحله‌ای (Two-Step Verification) یا همان 2FA، لایه حفاظتی دومی است که مانند قفل گاوصندوق پشت در ورودی عمل می‌کند. حتی اگر هکری رمز عبور شما را تصاحب کند، بدون دسترسی به کد دوم، ورود او غیرممکن است.","sectionTitle":"بررسی لایه‌ها و انواع سیستم‌های تایید دو مرحله‌ای","text":"سیستم‌های ۲FA به سه دسته کلی تقسیم می‌شوند: کدهای مبتنی بر پیامک (که ضعیف‌ترین هستند)، برنامه‌های احراز هویت اختصاصی (مانند Google Authenticator) و کلیدهای امنیتی سخت‌افزاری. در این میان، استفاده از برنامه‌هایی مثل گوگل آتنتیکیتور به این دلیل ایمن است که کدها به صورت آفلاین روی دستگاه شما تولید شده و غیرقابل شنود در شبکه مخابراتی هستند.","alert":"کدهای موقت احراز هویت، خط قرمز شماست! پشتیبانان واقعی اپراتورها، بانک‌ها یا پیام‌رسان‌ها هرگز کدهای ارسال شده به گوشی شما را درخواست نمی‌کنند. هر نوع تقاضای کد، تله کلاهبرداری است.","note":"برای هر حساب بزرگ، کدهای ریکاوری یا بازیابی نهایی پشتیبان تهیه کرده و آن‌ها را روی کاغذ در محلی کاملاً مطمئن یادداشت کنید تا در صورت مفقود شدن تلفن، اکانتتان از دست نرود.","mistake":"اکثر افراد روش پیامکی را انتخاب می‌کنند و فکر می‌کنند پیامک کاملاً امن است، در حالی که در صورت گم شدن یا به سرقت رفتن فیزیکی سیم‌کارت، سارق می‌تواند بلافاصله به راحتی کد را دریافت کند.","action":"به تنظیمات حریم خصوصی حساب گوگل، تلگرام و اینستاگرام خود بروید، بخش Two-Step Verification را بیابید و آن را با اولویت اپلیکیشن (Authenticator App) فعال کنید.","summary":"روشن کردن تایید دو مرحله‌ای، ضریب نفوذ مهاجمان را تا ۹۹٪ کاهش می‌دهد. این اقدام ارزشمندترین کاری است که هر کاربر امروزی باید انجام دهد.","isFree":false,"readMinutes":4},{"id":17,"title":"امنیت خرید و پرداخت اینترنتی","subtitle":"راهنمای استفاده ایمن از کارت‌های بانکی و خریدهای آنلاین موفق","icon":"CreditCard","intro":"پول نقد جای خود را به کدهای دیجیتالی و کارت‌های بانکی داده است. راحتی کارها فوق‌العاده است اما جابجایی سرمایه‌ها فاقد محافظت عاقلانه، سارقان سنتی را تبدیل به هکرهای مدرن و پیشرفته کرده است. خریدهای آنلاین را بدون هراس و با امنیت ۱۰۰ درصد انجام دهید.","sectionTitle":"آقای امنیت در خریدهای الکترونیکی","text":"سپر دفاعی نخست شما در پرداخت‌ها، استفاده بدون قید و شرط از رمزدوم پویا است. هرگز شماره کارت یا رمز دوم ایستا را روی وب‌سایت‌های مشکوک ذخیره نکنید. دومین نکته، استفاده از صفحه کلید مجازی ارائه شده در درگاه‌های پرداخت در زمان وارد کردن رمزهای حساس است تا در صورت وجود کی‌لاگر در دستگاه، ضربات انگشت شما فاش نشود. نکته سوم، همواره فعال بودن سرویس پیامک واریز و برداشت بانک مربوطه است تا از کوچکترین جابجایی‌ها سریعاً با خبر شوید.","alert":"پیامک‌های حاوی کدهای هدیه خرید یا لینک‌های تخفیف باورنکردنی کالاها معمولاً به درگاه‌های کپی کلاهبرداری ختم می‌شوند. در مواجهه با تخفیف‌های بالای ۷۰ درصد همواره یک قدم به عقب بردارید و تامل کنید.","note":"داشتن برنامه‌های پرداخت رسمی بومی و کیف‌پول‌های اعتباری معتبر کمک می‌کند بدون وارد کردن کارت‌بانکی مستقیم و تراکنش، خرید کارهای خود را با ایمنی انجام دهید.","mistake":"ذخیره کردن فایل عکس کارت عابربانک به همراه یادداشت پین کد کار‌های شخصی در گالری گوشی از متداول‌ترین مواردی است که کار سارقان و بدافزارهای نفوذی را در استخراج دارایی‌ها بی‌نهایت سهل می‌کند.","action":"به شعبه بانک یا خودپرداز خود مراجعه کنید و برای کارت‌های متصل به اینترنت خرید، حتماً سقف تراکنش روزانه را تا حد امکان کاهش دهید تا در صورت نشت، ضربه سهمگینی به حساب اصلی وارد نشود.","summary":"پول‌های شما ثمره زحمات شماست. با بکارگیری رفتارهای دفاعی ساده و خرید صرفاً از مراجع تایید صلاحیت شده، لذت خریدهای الکترونیکی را با آرامش تجربه کنید.","isFree":false,"readMinutes":5},{"id":18,"title":"امنیت و رفع هک ایتا","subtitle":"جلوگیری از دسترسی هکرها به چت‌ها و کانال‌های شما در پیام‌رسان ایتا","icon":"MessagesSquare","intro":"پیام‌رسان بومی ایتا مجمع فعالیت‌های کاری، تبادل کارنامه‌های تحصیلی، فیش‌های واریز اداری و فعالیت کانال‌های مرجع است. نفوذ به ایتا یعنی نفوذ به مراودات حساس شغلی و خانوادگی. با چند گام دفاعی هوشمند، ایتا را مقتدر عایق کنید.","sectionTitle":"مجموعه اقدامات امنیتی چنل‌ها و مدیریت نشست‌ها در ایتا","text":"شیوه متداول هک ایتا، فیشینگ کدهای تایید است. هکر با ارسال پیامکی ترغیب‌کننده در خصوص قرعه‌کشی یا کارهای تعجب‌برانگیز، کدهای پیامکی شما را تصاحب می‌کند. قدم اول دفاع، پایش منوی «دستگاه‌های متصل» در بخش امنیتی است. قدم دوم محافظت از ادمین‌ها در گروه‌ها و کانال‌هاست؛ باید مطمئن شوید ادمین‌های استخدام شده دسترسی‌های بدون حد و مرز نداشته باشند.","alert":"هر فرد ناشناسی که پیام می‌دهد «شما برنده مسابقه صدا و سیما شدید مشخصات بانکی و کد ارسالی را بفرستید»، فوراً بلاک و ریپورت گزارش کنید تا اکانت او مسدود شود.","note":"پیکربندی تایید هویت دو مرحله‌ای (Two-Step Verification) با کمک یک ایمیل یا جیمیل واقعی پشتیبان، ضامن ابدی پیج چت و بازیابی در ایتا خواهد ماند.","mistake":"استفاده بدون ممیزی از ایتا روی مرورگر رایانه‌های اداری اداره بدون خروج مجدد و لاگین ماندن دائم پس از ساعت کارها به طوری که همکاران بتوانند چت کنید.","action":"به تنظیمات ایتا رفته، حریم خصوصی و امنیت -> «دستگاه‌های متصل» را باز کرده و در صورت دیدن اتصالات پنهان، دسترسی آن‌ها را با قاطعیت قطع (Revoke) نمایید.","summary":"عناصر اداری نیاز به دژهای حفاظتی قوی دارند. با ممیزی مکرر گوشی‌های متصل به اکانت و تایید دومرحله‌ای فولادین، امنیت و کاری را برای همیشه تضمین کنید.","isFree":false,"readMinutes":4},{"id":19,"title":"چیکار کنم اصلاً هک نشم؟","subtitle":"شاه‌کلید پیشگیری پایه و بستن راه‌های نفوذ مهاجمان به تلفن همراه","icon":"Shield","intro":"پیشگیری همیشه ساده‌ترین، کم‌هزینه‌ترین و هوشمندانه ترین راهکار برای مقابله با خطرات سایبری است. در دنیای امنیت دیجیتال اصطلاحی داریم که می‌گوید: «مهاجم برای هک شما به تایید خودتان نیاز دارد!» با رعایت رفتارهای حفاظتی ساده می‌توانید احتمال هر نوع هک را به صفر برسانید.","sectionTitle":"ارکان سه‌گانه قلعه حفاظتی شخصی","text":"برای اینکه یک فایروال زنده در برابر نفوذ هکرها بسازید، باید ترافیک ورودی به ذهن و گوشی خود را فیلتر کنید. اولین رکن، بررسی فرستنده پیام است. رکن دوم، دانلود منحصراً رسمی و رکن سوم، فعالسازی سپرهای دفاعی خودکار است. سیستم‌های عامل نوین اندروید بسیار قدرتمند هستند، به شرطی که قفل درها را شخصاً برای سارقان باز نکنید.","alert":"هرگز روی پیوندهای پیامک‌شده از مراجع ناشناس با کارت‌های شخصی ضربه نزنید. سامانه‌های دولتی ابلاغیه (مانند همتا و ثنا) هرگز پیامک خود را با شماره شخصی (مانند ۰۹۱۲ یا همراه اول متفرقه) ارسال نمی‌کنند.","note":"نصب منظم و همیشگی بروزرسانی‌های امنیتی اندروید، وصله‌های اصلی دفاع در مقابل باگ‌های روز صفر (Zero-day) را روی دستگاه شما مستقر می‌سازد.","mistake":"بزرگترین اشتباه رایج کاربران این است که برای دانلود نسخه‌های مود شده (پرو رایگان) بازی‌ها یا فیلترشکن‌ها، به مراجع متفرقه یا ربات‌های تلگرامی رجوع می‌کنند و جاسوس‌افزارها را به صورت دستی روی گوشی نصب می‌کنند.","action":"همین الان وارد تنظیمات تلفن خود شوید، بخش «نصب برنامه‌های ناشناخته» (Install Unknown Apps) را سرچ کرده و دسترسی تمام مرورگرها و پیام‌رسان‌ها را به این ویژگی خاموش کنید.","summary":"امنیت یک ابزار یا یک برنامه نیست، بلکه یک رفتار آگاهانه است. با ممیزی رفتاری خود و افزایش سطح اطلاعات، به دژی نفوذناپذیر در فضای مجازی تبدیل خواهید شد.","isFree":false,"readMinutes":5},{"id":20,"title":"امنیت و رفع هک حساب گوگل","subtitle":"بزرگترین و مهمترین حسابی که کنترل کل گوشی اندرویدی شما را دارد","icon":"CircleUserRound","intro":"کل زندگی دیجیتال کاربران اندروید به حساب گوگل (جیمیل) متصل است. اگر شخصی به جیمیل شما نفوذ کند، به سادگی به گالری عکس‌های بکاپ، لیست مراجع شماره تماس مینی‌موم، حافظه ابری درایو و از همه مهم‌تر قابیلت Find My Device برای پاک کردن یا ردیابی مکانی زنده شما دسترسی خواهد داشت. پس کار مهمی است.","sectionTitle":"مراحل عایق‌کاری حساب گوگل در مقابل نفوذ","text":"دفاع از گوگل شامل ارزیابی بسترهای متصل است. در قدم اول باید رمز حساب خود را کاملاً یکپارچه و به دور از سایر پسوردها کنید. قدم دوم فعال کردن تایید دو مرحله‌ای است. ترجیحاً از Google Prompt استفاده کنید (که بر روی گوشی شما دکمه بله/خیر نشان می‌دهد). قدم سوم، بررسی دوره‌ای و واکشی مداوم دستگاه‌هایی است که در جیمیل لاگین کرده‌اند و برنامه‌های جانبی که دسترسی‌های ثانویه جیمیل دریافت کرده‌اند.","alert":"هرگز اطلاعات ایمیل بازیابی (Recovery Email) حساب گوگل را خالی نگذارید و ترجیحاً متعلق به نزدیکان یا حساب پشتیبان دوم مطمئن خود قرار دهید تا قفل شدن اکانت هرگز رخ ندهد.","note":"سیستم Advanced Protection گوگل ابزار فوق پیشرفته‌ای برای فعالان سیاسی، روزنامه‌نگاران و حساب‌های بسیار حساس است که ورود را کاملاً محدود به کلیدهای فیزیکی امنیتی می‌سازد.","mistake":"وارد شدن به حساب گوگل و ثبت دائم جیمیل روی رایانه‌های عمومی کاف‌نت‌ها، دانشگاه‌ها یا گوشی دیگران و عدم خروج مجدد از حساب پس از اتمام کارها.","action":"همین حالا به وب‌سایت https://myaccount.google.com بروید به بخش Security مراجعه کرده و گزینه «دستگاه‌های من» (Your Devices) را چک کنید؛ هر سخت‌افزار ناآشنایی دیدید، فوراً گزینه Sign Out را بفشارید.","summary":"حساب گوگل شما شاه‌قفل زندگی دیجیتال شماست. با چند لایه ممیزی ابزاری و واکشی اتصالات جاری، کانون نفوذ بدافزارها و هکرها را کاملاً باطل کنید.","isFree":false,"readMinutes":5}],"tools":[{"id":1,"title":"سپر طلایی: اسکن زنده امنیتی گوشی","subtitle":"امتیاز سلامت امنیتی گوشی","description":"بررسی چندوجهی و یکجای امنیت کل سیستم‌عامل شامل وضعیت روت، اشکال‌زدایی USB و لوکیشن‌های مجازی؛ ممیزی سیستم‌عامل، ردیابی شبیه‌سازها، مانیتور برنامه‌ها و روت در ۱ ثانیه","icon":"ShieldCheck","route":"golden-shield","isPro":false},{"id":2,"title":"مخفی‌یاب برنامه‌ها (اسکنر)","subtitle":"فعال‌سازی اسکنر زنده مخفی‌یاب برنامه‌ها بدون آیکون","description":"پیدا کردن اپ‌هایی که آیکون ندارند یا در لیست برنامه‌های میانبر پنهان شده‌اند؛ بسیاری از تروجان‌های تبلیغاتی یا جاسوس‌افزارها آیکون اجرای خود را در منوی اصلی مخفی می‌کنند تا شما نتوانید آن‌ها را ببینید.","icon":"EyeOff","route":"hidden-apps","isPro":false},{"id":3,"title":"برنامه‌های تازه نصب شده","subtitle":"فهرست جدیدترین برنامه‌های نصب شده با فیلتر زمانی دقیق","description":"بسیاری از بدافزارها بلافاصله پس از نصب پنهان می‌شوند. در این ابزار می‌توانید برنامه‌هایی را که جدیداً روی گوشی ریخته شده‌اند، بر اساس زمان نصب به صورت نزولی ببینید تا اپ جدید مخرب را فوراً شناسایی کنید.","icon":"Clock","route":"recent-apps","isPro":false},{"id":4,"title":"کاوشگر دسترسی‌های حساس برنامه‌ها","subtitle":"اسکن هوشمند دسترسی‌های حساس (پیامک، میکروفون، مکان)","description":"شناسایی برنامه‌هایی که به حوزه‌های فوق محرمانه پیامک، تماس، مکان، گالری و میکروفون وصل هستند؛ دسترسی‌های حساس نباید به برنامه‌های پیش‌پا افتاده مثل گالری‌های نامعتبر داده شود.","icon":"SearchCheck","route":"sensitive-permissions","isPro":true},{"id":5,"title":"بررسی برنامه‌های مدیر دستگاه","subtitle":"شناسایی برنامه‌هایی که مجوزهای مدیریتی کامل (Device Administrator) دارند","description":"برنامه‌های دارای مجوز Device Admin می‌توانند به‌طور کامل قفل صفحه را تغییر دهند، داده‌ها را پاک کنند یا مانع از حذف نصب خود شوند. بدافزارهای جاسوسی پیشرفته اغلب این دسترسی را به روش فریبکارانه فعال می‌کنند.","icon":"Crown","route":"device-admin","isPro":true},{"id":6,"title":"پایشگر دسترسی دستیار صوتی و حرکتی","subtitle":"اسکن زنده Accessibility Service فعال‌شده مزاحم","description":"قابلیت دسترسی (Accessibility) خطرناک‌ترین مجوز اندروید است! برنامه‌ای که این دسترسی را دارد می‌تواند محتوای تمام صفحه‌ها (شامل رمزهای عبور، تلگرام، واتساپ) را بخواند، کلیک‌های شما را ثبت کند و مخفیانه کارهای دیگر انجام دهد.","icon":"PersonStanding","route":"accessibility","isPro":true},{"id":7,"title":"بررسی برنامه‌های دارای Overlay","subtitle":"ردیابی برنامه‌هایی که توانایی ترسیم روی صفحه نمایشگر دارند","description":"قابلیت اورلی یا ترسیم روی سایر صفحات توسط برنامه‌های مخرب برای شبیه‌سازی درگاه‌های بانکی روی درگاه واقعی به کار می‌رود تا رمز شما را سرقت کنند. این ابزار برنامه‌های فعال این بخش را مشخص و اسکن می‌کند.","icon":"Layers","route":"overlay","isPro":true},{"id":8,"title":"بررسی دسترسی آمار استفاده (Usage Stats)","subtitle":"پایش اپلیکیشن‌هایی که آمار زمان استفاده شما را جمع‌آوری می‌کنند","description":"دسترسی به آمار استفاده (Usage Statistics)، به برنامه‌ها اجازه می‌دهد زمان باز و بسته شدن تک‌تک اپلیکیشن‌های گوشی شما را ثبت کنند که نقض حریم خصوصی است.","icon":"BarChart3","route":"usage-stats","isPro":true},{"id":9,"title":"ساخت رمز عبور قوی","subtitle":"تولید پسوردهای تصادفی بسیار پیچیده و ایمن بر اساس طول و کاراکترهای دلخواه","description":"دیگر نیازی به فکر کردن برای ساخت پسورد ایمن ندارید. این ابزار به صورت کاملاً آفلاین و تصادفی رمز عبورهای رمزنگاری‌شده قوی با حروف بزرگ، کوچک، کدهای ویژه و اعداد خلق می‌کند که غیرقابل کرک هستند.","icon":"KeyRound","route":"password-generator","isPro":false},{"id":10,"title":"تخمین قدرت رمز عبور","subtitle":"تحلیل هوشمند پسورد فعلی شما و نمایش نقاط ضعف و زمان مورد نیاز برای شکستن آن","description":"پسورد دلخواه خود را در این ابزار وارد کنید تا سیستم به صورت دقیق قدرت آن را تخمین بزند. همچنین بررسی می‌کند که آیا فرمول‌های هکری به راحتی آن را کشف می‌کنند یا خیر.","icon":"Gauge","route":"password-strength","isPro":false},{"id":11,"title":"میانبرهای طلایی تنظیمات امنیتی گوشی","subtitle":"دسترسی مستقیم و آسان به ۱۳ درگاه امنیتی سیستم","description":"سیستم عامل اندروید برای تسریع امور کاربران درگاه‌های امنیتی متعددی دارد که معمولاً در تنظیمات پیچیده پیدا کردنشان دشوار است. این پورتال ۱۳ میانبر حیاتی را یکجا در دسترس شما قرار می‌دهد.","icon":"Zap","route":"shortcuts","isPro":false},{"id":12,"title":"چک‌لیست امنیتی جامع گوشی","subtitle":"شناسنامه پدافند: چک‌لیست طلایی دفاع سایبری","description":"مجموعه‌ای از اقدامات عملی بسیار ارزشمند که با تیک زدن گام‌به‌گام آن‌ها، سطح دفاعی خود و خانواده را در مقابل نفوذها به حداکثر ممکن ارتقا می‌دهید. چک‌لیست تعاملی ذخیره‌شونده جهت پاکسازی گام‌به‌گام.","icon":"ListChecks","route":"checklist","isPro":false},{"id":13,"title":"نمایش تمام برنامه‌های نصب شده","subtitle":"مشاهده لیست تمام برنامه‌ها به همراه نام بسته و تاریخ نصب","description":"این ابزار اطلاعات جامعی از کلیه اپلیکیشن‌های نصب شده روی دستگاه در اختیار شما قرار می‌دهد تا برنامه‌های جاسوسی و فاقد آیکون را ردیابی کنید.","icon":"LayoutGrid","route":"all-apps","isPro":true}],"shortcuts":[{"id":1,"title":"۱. امنیت کلی سیستم","desc":"ممیزی سیستم‌عامل، ردیابی شبیه‌سازها، مانیتور برنامه‌ها و روت در ۱ ثانیه","icon":"Lock","steps":"تنظیمات گوشی را باز کنید\nمسیر «Security and privacy» را انتخاب کنید\nوضعیت قفل صفحه، رمزگذاری و بروزرسانی‌های امنیتی را بررسی کنید\nموارد هشداردهنده (نارنجی) را یکی‌یکی رفع کنید"},{"id":2,"title":"۲. سرویس‌های دسترسی‌پذیری","desc":"اسکن زنده Accessibility Service فعال‌شده مزاحم؛ واکشی عمیق سیستم و نمایش برنامه‌هایی که رفتارهای حرکتی و کلیک‌های شما را ثبت می‌کنند","icon":"PersonStanding","steps":"به تنظیمات بروید و «Accessibility» را جستجو کنید\nبخش Installed apps را باز کنید\nهر برنامه‌ای که نیاز واقعی ندارد این دسترسی را بدهید، غیرفعال کنید\nهیچگاه به برنامه‌ای که به آن ایمان ۱۰۰٪ ندارید اجازه دسترسی راحت تسهیلات را صادر نکنید"},{"id":3,"title":"۳. تنظیمات فیلترشکن و VPN","desc":"مسدودسازی فیلترشکن‌های مخفی یا کانکشن‌های پیوسته که اینترنت را تند پایش می‌کنند","icon":"Globe","steps":"به تنظیمات بروید و «VPN» را جستجو کنید\nلیست VPN‌های فعال را بررسی کنید\nهر برنامه ناشناخته‌ای که VPN تعریف کرده را حذف کنید\nفیلترشکن‌های غیررسمی و مجهول‌المقام را پاک‌سازی کنید"},{"id":4,"title":"۴. برنامه‌های ناشناخته (Unknown Apps)","desc":"غیرفعال کردن دسترسی برنامه‌های پیام‌رسان یا مرورگر به نصب فایل‌های APK مشکوک","icon":"PackageX","steps":"به تنظیمات بروید و «Install unknown apps» را جستجو کنید\nلیست برنامه‌هایی که مجوز نصب APK دارند را ببینید\nبرای مرورگرها و پیام‌رسان‌ها این مجوز را خاموش کنید\nفقط هنگام نصب موردی، مجوز را موقتاً فعال کنید"},{"id":5,"title":"۵. برنامه‌های پیش‌فرض (Default Apps)","desc":"لغو انتساب پیش‌فرض تماس یا پیامک به نرم‌افزارهای فیک پس از دانلود","icon":"AppWindow","steps":"به تنظیمات بروید و «Default apps» را باز کنید\nبرنامه پیش‌فرض تماس، پیامک و مرورگر را بررسی کنید\nاگر برنامه‌ای ناشناس پیش‌فرض شده، آن را به برنامه اصلی برگردانید\nبرنامه فیک را بلافاصله حذف نصب کنید"},{"id":6,"title":"۶. بهینه‌سازی و مصرف باتری","desc":"کشف ابزارهایی که با بیدار نگه داشتن مداوم پردازنده، هدررفت شارژ ایجاد می‌کنند","icon":"BatteryCharging","steps":"به تنظیمات بروید و «Battery» را باز کنید\nنمودار مصرف باتری به تفکیک برنامه را بررسی کنید\nبرنامه‌های ناشناسی که مصرف غیرعادی دارند را محدود یا حذف کنید\nحالت بهینه‌سازی باتری را برای برنامه‌های مشکوک فعال کنید"},{"id":7,"title":"۷. پایش Google Play Protect","desc":"اسکن سیستم با موتور زنده گوگل برای یافتن ماژول‌های بدافزار و جاسوسی","icon":"ScanSearch","steps":"به تنظیمات بروید، بخش Google -> Security را باز کنید\nروی «Google Play Protect» ضربه بزنید\nگزینه Scan apps with Play Protect را فعال نگه دارید\nدکمه Scan را بزنید و نتایج را ممیزی کنید"},{"id":8,"title":"۸. مدیر کلمه‌های عبور (Passwords)","desc":"ممیزی رمزهای لاگین ذخیره شده و ردیابی رمزهای لو رفته در دیتابیس‌ها","icon":"KeyRound","steps":"به تنظیمات بروید و «Passwords & accounts» را باز کنید\nرمزهای ذخیره شده در Google Password Manager را مرور کنید\nهشدارهای «رمز لو رفته» (Password Checkup) را جدی بگیرید\nرمزهای ضعیف و تکراری را با الگوی قوی جایگزین کنید"},{"id":9,"title":"۹. مدیریت اعلان‌ها و اعلام خطرها","desc":"محدود ساختن دسترسی نوتیفیکیشن‌ها برای جلوگیری از سرقت کدهای یکبارمصرف بانکی","icon":"BellOff","steps":"به تنظیمات بروید و «Notification access» را جستجو کنید\nبرنامه‌هایی که اجازه خواندن اعلان‌ها را دارند را ببینید\nدسترسی برنامه‌های ناشناس را ببندید تا کدهای بانکی شما از روی اعلان‌ها سرقت نشود\nاعلان‌های حساس بانک را روی قفل صفحه مخفی کنید"},{"id":10,"title":"۱۰. دسترسی‌های ویژه (Special Access)","desc":"محدود کردن دسترسی مزاحم پیامک، دوربین و تصاویر پس‌زمینه برنامه‌ها","icon":"Settings2","steps":"به تنظیمات بروید و «Special app access» را باز کنید\nبخش‌های Device admin، Overlay، Usage access و Premium SMS را ممیزی کنید\nدسترسی‌های مشکوک را لغو کنید\nفقط به برنامه‌های موردنیاز واقعی این اختیارات را بدهید"},{"id":11,"title":"۱۱. مصرف دیتا و اتصال آنلاین","desc":"محدود کردن اتصال پس‌زمینه اپلیکیشن‌های مشکوک برای مهار انتقال فایل‌های حجیم","icon":"Wifi","steps":"به تنظیمات بروید و «Data usage» را باز کنید\nمصرف دیتای پس‌زمینه (Background data) هر برنامه را بررسی کنید\nبرنامه‌های ناشناسی که حجم نجومی آپلود می‌کنند را قطع یا حذف کنید\nسهمیه دیتای پس‌زمینه برنامه‌های غیرضروری را ببندید"},{"id":12,"title":"۱۲. اکانت‌ها و حساب‌های دستگاه","desc":"بررسی جیمیل‌ها و حساب‌های همسان‌سازی شده ناشناس روی تبلت یا موبایل شما","icon":"Users","steps":"به تنظیمات بروید و «Accounts» را باز کنید\nلیست کامل حساب‌های اضافه شده به دستگاه را ببینید\nهر حساب ناشناس یا غیر از حساب‌های خودتان را فوراً Remove کنید\nسپس رمز عبور آن حساب را از یک دستگاه مطمئن تغییر دهید"},{"id":13,"title":"۱۳. ردیاب و پیدا کردن گوشی من","desc":"فعال‌سازی سرویس Find My Device برای امکان ردیابی، قفل و پاکسازی از راه دور تلفن همراه","icon":"MapPin","steps":"به تنظیمات بروید و «Find My Device» را جستجو کنید\nسرویس را روشن کنید تا مکان دستگاه قابل ردیابی باشد\nدر سایت google.com/android/find امکان قفل و پاک از راه دور را تست کنید\nاین سرویس در سرقت یا گم شدن گوشی، ناجی شماست"}],"checklist":[{"id":1,"title":"فعال‌سازی قفل سخت‌افزاری صفحه","desc":"بررسی قفل صفحه، وضعیت حافظه امنیتی، فیس‌آیدی و اثر انگشت — فعال‌سازی قفل سخت‌افزاری صفحه (اثر انگشت یا الگو پیچیده)","icon":"Fingerprint"},{"id":2,"title":"روشن کردن تایید دو مرحله‌ای (2FA)","desc":"روشن کردن تایید دو مرحله‌ای (SMS یا Authenticator) روی حساب‌های اصلی گوگل و شبکه‌های اجتماعی","icon":"ShieldCheck"},{"id":3,"title":"فعال‌سازی سرویس Find My Device","desc":"فعال‌سازی سرویس Find My Device برای امکان ردیابی، قفل و پاکسازی از راه دور تلفن همراه","icon":"MapPin"},{"id":4,"title":"آپدیت همیشگی سیستم‌عامل اندروید","desc":"آپدیت همیشگی سیستم‌عامل اندروید و آپدیت امنیتی ماهانه گوگل پلی","icon":"RefreshCw"},{"id":5,"title":"غیرفعال کردن عیب‌یابی USB","desc":"غیرفعال کردن عیب‌یابی سریع USB (USB Debugging) در زمان عدم نیاز","icon":"Usb"},{"id":6,"title":"بستن مجوز نصب APK ناشناس","desc":"غیرفعال کردن دسترسی برنامه‌های پیام‌رسان یا مرورگر به نصب فایل‌های APK مشکوک","icon":"PackageX"},{"id":7,"title":"لغو انتساب پیش‌فرض برنامه‌های فیک","desc":"لغو انتساب پیش‌فرض تماس یا پیامک به نرم‌افزارهای فیک پس از دانلود","icon":"AppWindow"},{"id":8,"title":"بستن برنامه‌های Overlay نامعلوم","desc":"بستن کامل یا مسدودسازی برنامه‌های حباب شناور نامعلوم (Overlay)","icon":"Layers"},{"id":9,"title":"محدودسازی دسترسی نوتیفیکیشن‌ها","desc":"محدود ساختن دسترسی نوتیفیکیشن‌ها برای جلوگیری از سرقت کدهای یکبارمصرف بانکی","icon":"BellOff"},{"id":10,"title":"مهار اتصال پس‌زمینه اپ‌ها const LS = { pro:'ainthack-pro', theme:'ainthack-theme', font:'ainthack-font', device:'ainthack-device-code', onboarded:'ainthack-onboarded', checklist:'ainthack-checklist', state:'ainthack-devicestate', apps:'ainthack-simapps', score:'ainthack-lastscan' };
const $ = (s, r) => (r || document).querySelector(s);
const esc = s => String(s ?? '').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
const fa = n => Number(n).toLocaleString('fa-IR');
const fa1 = n => Number(n).toLocaleString('fa-IR', { maximumFractionDigits: 1 });
const faDate = iso => new Date(iso).toLocaleDateString('fa-IR', { year:'numeric', month:'long', day:'numeric' });
const faVer = v => String(v ?? '').replace(/\d/g, d => '۰۱۲۳۴۵۶۷۸۹'[d]);
const ic = (name, cls) => '<svg class="ic ' + (cls||'') + '" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">' + (ICONS[name] || ICONS.Shield) + '</svg>';
const sleep = ms => new Promise(r => setTimeout(r, ms));

function toast(msg, type) {
  const el = document.createElement('div');
  el.className = 'toast ' + (type || '');
  el.innerHTML = (type === 'err' ? ic('AlertTriangle', 'xs') : ic('CheckCircle2', 'xs')) + '<span>' + esc(msg) + '</span>';
  $('#toast').appendChild(el);
  setTimeout(() => { el.style.opacity = '0'; el.style.transition = 'opacity .3s'; setTimeout(() => el.remove(), 320); }, 2400);
}

/* ═══════════ وضعیت برنامه (مانند اپ اصلی با localStorage) ═══════════ */
const DEFAULT_STATE = { screenLock:'fingerprint', usbDebugging:true, playProtect:true, unknownSources:true, securityPatch:'2025-05-01', findMyDevice:false, simPin:false, autoUpdates:true, notifUnlocked:true };

const S = {
  stack: [{ name:'home' }],
  isPro: false, theme:'dark', font:'md', deviceCode:'',
  deviceState: JSON.parse(JSON.stringify(DEFAULT_STATE)),
  apps: [], lastScanScore: null,
};

function loadState() {
  try {
    S.isPro = localStorage.getItem(LS.pro) === '1';
    S.theme = localStorage.getItem(LS.theme) || 'dark';
    S.font = localStorage.getItem(LS.font) || 'md';
    let d = localStorage.getItem(LS.device);
    if (!d) {
      const chars = 'ABCDEF0123456789';
      const seg = () => Array.from({ length:4 }, () => chars[Math.floor(Math.random()*chars.length)]).join('');
      d = seg() + '-' + seg() + '-' + seg();
      try { localStorage.setItem(LS.device, d); } catch(e){}
    }
    S.deviceCode = d;
    const st = localStorage.getItem(LS.state);
    if (st) S.deviceState = Object.assign(JSON.parse(JSON.stringify(DEFAULT_STATE)), JSON.parse(st));
    const ap = localStorage.getItem(LS.apps);
    S.apps = ap ? JSON.parse(ap) : JSON.parse(JSON.stringify(DATA.simApps.map(a => Object.assign({}, a, { permissions: Array.isArray(a.permissions) ? a.permissions : (a.permissions ? String(a.permissions).split(',') : []) }))));
    const sc = localStorage.getItem(LS.score);
    S.lastScanScore = sc === null || sc === undefined ? null : Number(sc);
  } catch(e) {}
  document.documentElement.classList.toggle('dark', S.theme === 'dark');
  document.documentElement.style.setProperty('--appfs', { sm:'0.875rem', md:'1rem', lg:'1.125rem', xl:'1.25rem' }[S.font] || '1rem');
}
const saveState = () => { try { localStorage.setItem(LS.state, JSON.stringify(S.deviceState)); localStorage.setItem(LS.apps, JSON.stringify(S.apps)); localStorage.setItem(LS.score, JSON.stringify(S.lastScanScore)); } catch(e){} };

function setTheme(t) { S.theme = t; try { localStorage.setItem(LS.theme, t); } catch(e){} document.documentElement.classList.toggle('dark', t === 'dark'); }
function setFont(f) { S.font = f; try { localStorage.setItem(LS.font, f); } catch(e){} document.documentElement.style.setProperty('--appfs', { sm:'0.875rem', md:'1rem', lg:'1.125rem', xl:'1.25rem' }[f] || '1rem'); }
function setPro(v) { S.isPro = v; try { localStorage.setItem(LS.pro, v ? '1' : '0'); } catch(e){} }

function titleFor() {
